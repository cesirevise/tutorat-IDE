<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fiches — CESIREVISE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --bleu-cesir: #77A5AA;
            --mauve: #D585A9;
            --rouge: #EB5555;
            --vert: #7EAA83;
            --jaune: #FFD230;
            --marron: #9A7458;
            --noir: #111111;
            --blanc: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--blanc);
            color: var(--noir);
            font-family: "League Spartan", sans-serif;
            overflow-x: hidden;
        }

        /* -------------------------
           EN-TÊTE
        ------------------------- */

        header {
            text-align: center;
            padding: 45px 25px 20px;
        }

        .logo {
            width: min(260px, 65vw);
            height: auto;
        }

        /* -------------------------
           TITRE
        ------------------------- */

        .titre {
            text-align: center;
            padding: 35px 25px 55px;
        }

        .titre h1 {
            margin: 0;
            color: var(--noir);
            font-size: clamp(48px, 8vw, 75px);
            font-weight: 700;
        }

        .titre p {
            max-width: 650px;
            margin: 18px auto 0;
            font-size: 20px;
            line-height: 1.5;
        }

        /* -------------------------
           BULLES
        ------------------------- */

        .categories {
            width: min(1100px, 92%);
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 45px;

            padding-bottom: 90px;
        }

        .bulle {
            min-height: 250px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px;

            color: var(--blanc);
            text-decoration: none;
            text-align: center;

            font-size: clamp(27px, 3vw, 38px);
            font-weight: 700;
            letter-spacing: 0.5px;

            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.18),
                inset 0 -8px 0 rgba(0, 0, 0, 0.08);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .bulle:hover {
            transform: translateY(-10px) scale(1.03);

            box-shadow:
                0 28px 45px rgba(0, 0, 0, 0.25),
                inset 0 -8px 0 rgba(0, 0, 0, 0.08);
        }

        .bulle:active {
            transform: scale(0.97);
        }

        /* -------------------------
           COULEURS
        ------------------------- */

        .physiopatho {
            background: var(--bleu-cesir);
        }

        .psychopatho {
            background: var(--mauve);
        }

        .pharmaco {
            background: var(--rouge);
        }

        .normes {
            background: var(--vert);
        }

        .orientation {
            background: var(--jaune);
        }

        .stage {
            background: var(--marron);
        }

        /* -------------------------
           RETOUR
        ------------------------- */

        .retour {
            display: block;
            width: fit-content;

            margin: 0 auto 70px;

            padding: 16px 32px;

            border-radius: 30px;

            background: var(--noir);
            color: var(--blanc);

            text-decoration: none;

            font-size: 18px;
            font-weight: 600;

            transition: transform 0.25s ease;
        }

        .retour:hover {
            transform: scale(1.05);
        }

        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 700px) {

            .categories {
                width: 94%;
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }

            .bulle {
                min-height: 170px;
                padding: 20px;

                font-size: 22px;

                box-shadow:
                    0 12px 25px rgba(0, 0, 0, 0.18),
                    inset 0 -6px 0 rgba(0, 0, 0, 0.08);
            }

            .titre {
                padding-bottom: 35px;
            }

            .titre h1 {
                font-size: 48px;
            }

            .titre p {
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

    <header>

        <img
            src="logo-cesirevise.png"
            alt="Logo CESIREVISE"
            class="logo"
        >

    </header>


    <main>

        <section class="titre">

            <h1>FICHES</h1>

            <p>
                Retrouve ici les fiches et ressources de CESIREVISE.
                Chaque catégorie rassemble les contenus correspondant
                au thème choisi.
            </p>

        </section>


        <section class="categories">

            <a href="physiopatho.html" class="bulle physiopatho">
                PHYSIOPATHO
            </a>

            <a href="#" class="bulle psychopatho">
                PSYCHOPATHO
            </a>

            <a href="pharmaco.html" class="bulle pharmaco">
                PHARMACO
            </a>

            <a href="#" class="bulle normes">
                NORMES<br>BIOLOGIQUES
            </a>

            <a href="#" class="bulle orientation">
                ORIENTATION
            </a>

            <a href="#" class="bulle stage">
                STAGE / TP
            </a>

        </section>


        <a href="index.html" class="retour">
            ← Retour à l'accueil
        </a>

    </main>

</body>
</html>
