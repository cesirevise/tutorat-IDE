<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Normes biologiques — CESIREVISE</title>

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>

        :root {
            --vert: #8EAC51;
            --vert-pale: #F0F5E5;
            --vert-transparent: rgba(142, 172, 81, 0.18);
            --vert-ombre: rgba(142, 172, 81, 0.12);
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(119, 165, 170, 0.18),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(119, 165, 170, 0.14),
                    transparent 30%
                ),
                var(--vert-pale);

            color: var(--noir);

            font-family: "League Spartan", sans-serif;

            overflow-x: hidden;

            position: relative;
        }


        /* -------------------------
           GRAND LOGO EN FOND
        ------------------------- */

        body::before {

            content: "";

            position: fixed;

            width: 1150px;
            height: 1150px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background-image: url("logo-cesirevise.png");

            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;

            opacity: 0.055;

            pointer-events: none;

            z-index: 0;
        }


        /* -------------------------
           CONTENU
        ------------------------- */

        .page {

            position: relative;

            z-index: 1;

            width: min(1150px, 92%);

            margin: 0 auto;

            padding: 60px 0 100px;
        }


        /* -------------------------
           RETOUR
        ------------------------- */

        .retour {

            display: inline-flex;

            align-items: center;

            padding: 12px 22px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.75);

            color: var(--noir);

            text-decoration: none;

            font-weight: 600;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .retour:hover {

            transform: translateY(-3px);

            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }


        /* -------------------------
           TITRE
        ------------------------- */

        .titre {

            text-align: center;

            padding: 55px 15px 60px;
        }


        .titre h1 {

            margin: 0;

            font-family: "Baloo 2", cursive;

            font-size: clamp(55px, 9vw, 105px);

            line-height: 0.9;

            color: var(--vert);

            letter-spacing: -2px;

            transform: rotate(-2deg);

            text-shadow:
                3px 3px 0 rgba(255, 255, 255, 0.8),
                7px 8px 0 rgba(119, 165, 170, 0.12);
        }


        .titre p {

            margin: 22px auto 0;

            max-width: 700px;

            font-size: 20px;

            line-height: 1.5;

            opacity: 0.85;
        }


        /* -------------------------
           LISTE DES FICHES
        ------------------------- */

        .fiches {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 28px;

            padding: 10px 0;
        }


        /* -------------------------
           RECTANGLES
        ------------------------- */

        .pdf {

            min-height: 125px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.88);

            border: 3px solid rgba(119, 165, 170, 0.45);

            color: var(--vert);

            text-decoration: none;

            font-size: 25px;

            font-weight: 700;

            text-align: center;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.10),
                8px 8px 0 rgba(119, 165, 170, 0.12);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        .pdf:hover {

            transform:
                translateY(-7px)
                rotate(-1deg);

            background: var(--blanc);

            box-shadow:
                0 20px 35px rgba(0, 0, 0, 0.15),
                10px 10px 0 rgba(119, 165, 170, 0.18);
        }


        .pdf:nth-child(3n) {

            border-radius: 38px 26px 34px 28px;
        }


        .pdf:nth-child(3n + 1) {

            border-radius: 26px 38px 28px 34px;
        }


        .pdf:nth-child(4n) {

            transform: rotate(0.8deg);
        }


        .pdf:nth-child(4n):hover {

            transform:
                translateY(-7px)
                rotate(1.5deg);
        }


        /* -------------------------
           PETITS ÉLÉMENTS DÉCORATIFS
        ------------------------- */

        .deco {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;
        }


        .deco.one {

            width: 90px;
            height: 90px;

            background: rgba(119, 165, 170, 0.12);

            top: 15%;
            left: -30px;
        }


        .deco.two {

            width: 130px;
            height: 130px;

            background: rgba(119, 165, 170, 0.10);

            right: -45px;
            top: 42%;
        }


        .deco.three {

            width: 65px;
            height: 65px;

            background: rgba(119, 165, 170, 0.16);

            left: 5%;
            bottom: 12%;
        }


        /* -------------------------
           MOBILE
        ------------------------- */

        @media (max-width: 700px) {

            .page {

                width: 94%;

                padding-top: 30px;
            }


            .titre {

                padding: 45px 5px 45px;
            }


            .titre h1 {

                font-size: 58px;
            }


            .titre p {

                font-size: 18px;
            }


            .fiches {

                grid-template-columns: repeat(2, 1fr);

                gap: 16px;
            }


            .pdf {

                min-height: 115px;

                padding: 18px 10px;

                font-size: 20px;

                border-radius: 24px;
            }


            body::before {

                width: 700px;
                height: 700px;

                opacity: 0.045;
            }

        }

    </style>
</head>


<body>

    <!-- Éléments décoratifs -->

    <span class="deco one"></span>
    <span class="deco two"></span>
    <span class="deco three"></span>


    <main class="page">


        <!-- RETOUR -->

        <a href="fiches.html" class="retour">
            ← Retour aux fiches
        </a>


        <!-- TITRE -->

        <section class="titre">

            <h1>NORMES BIOLOGIQUES</h1>

            <p>
                Tes fiches pour connaître les principales normes biologiques
                et les valeurs indispensables à retenir en IFSI.
            </p>

        </section>


        <!-- FICHES -->

        <section class="fiches">


            <a href="nfs.jpg" class="pdf">
                NFS
            </a>


            <a href="iono.jpg" class="pdf">
                IONOGRAMME
            </a>


            <a href="bilan-renal.jpg" class="pdf">
                BILAN RÉNAL
            </a>


            <a href="bilan-hepatique.jpg" class="pdf">
                BILAN HÉPATIQUE
            </a>


            <a href="bilan-coag.jpg" class="pdf">
                BILAN DE COAGULATION
            </a>


            <a href="bilan-lipidique.jpg" class="pdf">
                BILAN LIPIDIQUE
            </a>


            <a href="bilan-glycemique.jpg" class="pdf">
                BILAN GLYCÉMIQUE
            </a>


            <a href="bilan-cardio.jpg" class="pdf">
                MARQUEURS CARDIAQUES
            </a>

        </section>

    </main>

</body>
</html>
