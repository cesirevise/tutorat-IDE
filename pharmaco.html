<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmaco — CESIREVISE</title>
    <!-- POLICES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rouge: #EB5555;
            --rouge-pale: #FFF0F0;
            --noir: #111111;
            --blanc: #FFFFFF;
        }
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 8% 18%,
                    rgba(235, 85, 85, 0.16),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 92% 70%,
                    rgba(235, 85, 85, 0.12),
                    transparent 30%
                ),
                var(--rouge-pale);
            color: var(--noir);
            font-family: "League Spartan", sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        /* =========================
           GRAND LOGO EN FOND
        ========================== */
        body::before {
            content: "";
            position: fixed;
            width: 1100px;
            height: 1100px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-image: url("logo-cesirevise.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.055;
            pointer-events: none;
            z-index: 0;
        }
        /* =========================
           CONTENU
        ========================== */
        .page {
            position: relative;
            z-index: 1;
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 50px 0 90px;
        }
        /* =========================
           BOUTON RETOUR
        ========================== */
        .retour {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.82);
            color: var(--noir);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.08);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }
        .retour:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.12);
        }
        /* =========================
           TITRE
        ========================== */
        .titre {
            text-align: center;
            padding: 55px 10px 55px;
            width: 100%;
        }
        .titre h1 {
            margin: 0;
            font-family: "Baloo 2", cursive;
            font-size: clamp(65px, 10vw, 115px);
            line-height: 0.9;
            color: var(--rouge);
            letter-spacing: -2px;
            transform: rotate(-2deg);
            text-shadow:
                3px 3px 0 rgba(255, 255, 255, 0.9),
                7px 8px 0 rgba(235, 85, 85, 0.12);
        }
        .titre p {
            margin: 22px auto 0;
            width: min(650px, 100%);
            font-size: 20px;
            line-height: 1.5;
            opacity: 0.85;
        }
        /* =========================
           FICHES
        ========================== */
        .fiches {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
            width: 100%;
            padding: 5px 0;
        }
        /* =========================
           CARTES PDF
        ========================== */
        .pdf {
            min-width: 0;
            min-height: 125px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.92);
            border: 3px solid rgba(235, 85, 85, 0.42);
            color: var(--rouge);
            text-decoration: none;
            font-size: 25px;
            font-weight: 700;
            text-align: center;
            line-height: 1.1;
            overflow-wrap: break-word;
            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.10),
                8px 8px 0 rgba(235, 85, 85, 0.12);
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }
        .pdf:hover {
            transform:
                translateY(-7px)
                rotate(-1deg);
            background: var(--blanc);
            box-shadow:
                0 20px 35px rgba(0, 0, 0, 0.15),
                10px 10px 0 rgba(235, 85, 85, 0.18);
        }
        .pdf:nth-child(3n) {
            border-radius: 38px 26px 34px 28px;
        }
        .pdf:nth-child(3n + 1) {
            border-radius: 26px 38px 28px 34px;
        }
        .pdf:nth-child(4n) {
            transform: rotate(0.8deg);
        }
        .pdf:nth-child(4n):hover {
            transform:
                translateY(-7px)
                rotate(1.5deg);
        }
        /* =========================
           DÉCORATIONS
        ========================== */
        .pharma-deco {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            color: var(--rouge);
            opacity: 0.42;
        }
        /* MOLÉCULE */
        .molecule {
            width: 120px;
            height: 120px;
            top: 17%;
            left: 2%;
            animation: float 5s ease-in-out infinite;
        }
        .molecule circle {
            fill: var(--rouge);
        }
        .molecule line {
            stroke: var(--rouge);
            stroke-width: 4;
            stroke-linecap: round;
        }
        /* BÉCHER */
        .becher {
            width: 95px;
            height: 110px;
            right: 3%;
            top: 28%;
            animation: float 6s ease-in-out infinite reverse;
        }
        .becher path {
            fill: rgba(235, 85, 85, 0.10);
            stroke: var(--rouge);
            stroke-width: 4;
            stroke-linejoin: round;
        }
        .becher line {
            stroke: var(--rouge);
            stroke-width: 4;
            stroke-linecap: round;
        }
        /* GÉLULE */
        .gelule {
            width: 100px;
            height: 65px;
            left: 1%;
            bottom: 25%;
            animation: floatGelule 6s ease-in-out infinite;
        }
        .gelule rect {
            fill: rgba(235, 85, 85, 0.12);
            stroke: var(--rouge);
            stroke-width: 4;
        }
        .gelule line {
            stroke: var(--rouge);
            stroke-width: 4;
        }
        /* FIOLE */
        .fiole {
            width: 80px;
            height: 110px;
            right: 4%;
            bottom: 12%;
            animation: float 5.5s ease-in-out infinite;
        }
        .fiole path {
            fill: rgba(235, 85, 85, 0.10);
            stroke: var(--rouge);
            stroke-width: 4;
            stroke-linejoin: round;
        }
        .fiole line {
            stroke: var(--rouge);
            stroke-width: 4;
            stroke-linecap: round;
        }
        /* PETITE PILULE */
        .pilule {
            width: 65px;
            height: 45px;
            right: 14%;
            top: 14%;
            animation: floatPilule 5s ease-in-out infinite;
        }
        .pilule ellipse {
            fill: rgba(235, 85, 85, 0.12);
            stroke: var(--rouge);
            stroke-width: 4;
        }
        .pilule line {
            stroke: var(--rouge);
            stroke-width: 3;
        }
        /* =========================
           ANIMATIONS
        ========================== */
        @keyframes float {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(3deg);
            }
        }
        @keyframes floatGelule {
            0%,
            100% {
                transform: translateY(0) rotate(-25deg);
            }
            50% {
                transform: translateY(-12px) rotate(-20deg);
            }
        }
        @keyframes floatPilule {
            0%,
            100% {
                transform: translateY(0) rotate(25deg);
            }
            50% {
                transform: translateY(-9px) rotate(30deg);
            }
        }
        /* =========================
           TABLETTE
        ========================== */
        @media (max-width: 700px) {
            body::before {
                width: 700px;
                height: 700px;
                opacity: 0.045;
            }
            .page {
                width: 92%;
                padding-top: 28px;
                padding-bottom: 60px;
            }
            /* RETOUR */
            .retour {
                padding: 10px 18px;
                font-size: 15px;
            }
            /* TITRE */
            .titre {
                padding: 42px 0 40px;
            }
            .titre h1 {
                font-size: clamp(58px, 17vw, 78px);
                letter-spacing: -2px;
                line-height: 0.9;
            }
            .titre p {
                margin-top: 20px;
                padding: 0 8px;
                font-size: 18px;
                line-height: 1.45;
            }
            /* FICHES */
            .fiches {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }
            /* CARTES */
            .pdf {
                min-height: 120px;
                padding: 16px 10px;
                font-size: 19px;
                line-height: 1.08;
                border-width: 2.5px;
                border-radius: 24px;
                box-shadow:
                    0 8px 18px rgba(0, 0, 0, 0.09),
                    5px 5px 0 rgba(235, 85, 85, 0.10);
            }
            /* DÉCORATIONS */
            .pharma-deco {
                opacity: 0.24;
            }
            .molecule {
                width: 70px;
                height: 70px;
                left: -12px;
                top: 18%;
            }
            .becher {
                width: 60px;
                height: 70px;
                right: -8px;
                top: 29%;
            }
            .gelule {
                width: 65px;
                height: 42px;
                left: -10px;
                bottom: 22%;
            }
            .fiole {
                width: 52px;
                height: 72px;
                right: -6px;
                bottom: 13%;
            }
            .pilule {
                width: 48px;
                height: 33px;
                right: 4%;
                top: 13%;
            }
        }
        /* =========================
           PETITS TÉLÉPHONES
        ========================== */
        @media (max-width: 380px) {
            .page {
                width: 90%;
            }
            .titre {
                padding-top: 38px;
                padding-bottom: 35px;
            }
            .titre h1 {
                font-size: 53px;
                letter-spacing: -2.5px;
            }
            .titre p {
                font-size: 17px;
            }
            .fiches {
                gap: 12px;
            }
            .pdf {
                min-height: 105px;
                padding: 14px 7px;
                font-size: 17px;
            }
            .molecule {
                left: -18px;
            }
            .becher {
                right: -15px;
            }
            .gelule {
                left: -15px;
            }
            .fiole {
                right: -12px;
            }
        }
    </style>
</head>
