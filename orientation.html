<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Métier & Orientation — CESIREVISE</title>

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --jaune: #FFD230;

            --jaune-pale: #FFF7D6;

            --jaune-transparent:
                rgba(255, 210, 48, 0.18);

            --jaune-ombre:
                rgba(255, 210, 48, 0.12);

            --bleu:
                #77A5AA;

            --noir:
                #202020;

            --blanc:
                #FFFFFF;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 210, 48, 0.18),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 210, 48, 0.14),
                    transparent 30%
                ),

                var(--jaune-pale);

            color: var(--noir);

            font-family:
                "League Spartan",
                sans-serif;

            overflow-x: hidden;

            position: relative;
        }


        /* =====================================================
           GRAND LOGO EN FOND
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 1150px;
            height: 1150px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background-image:
                url("logo-cesirevise.png");

            background-repeat: no-repeat;

            background-position: center;

            background-size: contain;

            opacity: 0.055;

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           CONTENU
        ===================================================== */

        .page {

            position: relative;

            z-index: 2;

            width:
                min(1150px, 92%);

            margin: 0 auto;

            padding:
                60px 0 100px;
        }


        /* =====================================================
           RETOUR
        ===================================================== */

        .retour {

            display: inline-flex;

            align-items: center;

            padding:
                12px 22px;

            border-radius:
                30px;

            background:
                rgba(255, 255, 255, 0.78);

            color:
                var(--noir);

            text-decoration:
                none;

            font-weight:
                600;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .retour:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.12);
        }


        /* =====================================================
           TITRE
        ===================================================== */

        .titre {

            text-align:
                center;

            padding:
                55px 15px 60px;
        }


        .titre h1 {

            margin: 0;

            font-family:
                "Baloo 2",
                cursive;

            font-size:
                clamp(48px, 8vw, 100px);

            line-height:
                0.9;

            color:
                var(--jaune);

            letter-spacing:
                -2px;

            transform:
                rotate(-2deg);

            text-shadow:

                3px 3px 0
                rgba(255, 255, 255, 0.85),

                7px 8px 0
                rgba(119, 165, 170, 0.12);
        }


        .titre p {

            margin:
                22px auto 0;

            max-width:
                700px;

            font-size:
                20px;

            line-height:
                1.5;

            opacity:
                0.85;
        }


        /* =====================================================
           LISTE DES FICHES
        ===================================================== */

        .fiches {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                28px;

            padding:
                10px 0;
        }


        /* =====================================================
           CASES PDF
        ===================================================== */

        .pdf {

            position:
                relative;

            min-height:
                145px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                25px;

            border-radius:
                30px;

            background:
                rgba(255, 255, 255, 0.90);

            border:
                3px solid
                rgba(255, 210, 48, 0.75);

            color:
                var(--jaune);

            text-decoration:
                none;

            font-size:
                25px;

            font-weight:
                700;

            text-align:
                center;

            box-shadow:

                0 12px 25px
                rgba(0, 0, 0, 0.10),

                8px 8px 0
                var(--jaune-ombre);

            overflow:
                hidden;

            transition:

                transform 0.3s ease,

                box-shadow 0.3s ease,

                background 0.3s ease;
        }


        .pdf:hover {

            transform:
                translateY(-7px)
                rotate(-1deg);

            background:
                var(--blanc);

            box-shadow:

                0 20px 35px
                rgba(0, 0, 0, 0.15),

                10px 10px 0
                rgba(255, 210, 48, 0.20);
        }


        /* =====================================================
           FORMES DIFFÉRENTES DES CASES
        ===================================================== */

        .pdf:nth-child(3n) {

            border-radius:
                38px 26px 34px 28px;
        }


        .pdf:nth-child(3n + 1) {

            border-radius:
                26px 38px 28px 34px;
        }


        .pdf:nth-child(4n) {

            transform:
                rotate(0.8deg);
        }


        .pdf:nth-child(4n):hover {

            transform:
                translateY(-7px)
                rotate(1.5deg);
        }


        /* =====================================================
           PETITE ICÔNE DANS LES CASES
        ===================================================== */

        .pdf-icon {

            position:
                absolute;

            right:
                18px;

            top:
                12px;

            width:
                38px;

            height:
                38px;

            opacity:
                0.13;
        }


        .pdf-icon svg {

            width:
                100%;

            height:
                100%;

            fill:
                none;

            stroke:
                var(--jaune);

            stroke-width:
                2.5;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;
        }


        /* =====================================================
           DÉCORATIONS MÉDICALES
        ===================================================== */

        .medical-deco {

            position:
                fixed;

            z-index:
                1;

            pointer-events:
                none;

            opacity:
                0.28;

            color:
                var(--jaune);
        }


        .medical-deco svg {

            width:
                100%;

            height:
                100%;

            fill:
                none;

            stroke:
                var(--jaune);

            stroke-width:
                4;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;
        }


        /* =====================================================
           STÉTHOSCOPE
        ===================================================== */

        .stethoscope {

            width:
                125px;

            height:
                150px;

            left:
                -15px;

            top:
                19%;

            transform:
                rotate(-12deg);
        }


        /* =====================================================
           ECG
        ===================================================== */

        .ecg {

            width:
                190px;

            height:
                80px;

            right:
                -35px;

            top:
                28%;

            transform:
                rotate(4deg);
        }


        /* =====================================================
           RADIO
        ===================================================== */

        .xray {

            width:
                105px;

            height:
                135px;

            left:
                1%;

            bottom:
                20%;

            transform:
                rotate(-8deg);
        }


        /* =====================================================
           SQUELETTE / OS
        ===================================================== */

        .bone {

            width:
                125px;

            height:
                90px;

            right:
                -20px;

            bottom:
                20%;

            transform:
                rotate(18deg);
        }


        /* =====================================================
           CROIX MÉDICALE
        ===================================================== */

        .cross {

            width:
                70px;

            height:
                70px;

            right:
                13%;

            top:
                13%;

            transform:
                rotate(8deg);
        }


        /* =====================================================
           SERINGUE
        ===================================================== */

        .syringe {

            width:
                120px;

            height:
                65px;

            left:
                12%;

            bottom:
                7%;

            transform:
                rotate(-15deg);
        }


        /* =====================================================
           CERCLES DÉCORATIFS
        ===================================================== */

        .deco-circle {

            position:
                fixed;

            border-radius:
                50%;

            pointer-events:
                none;

            z-index:
                0;

            border:
                4px solid
                var(--jaune);

            opacity:
                0.25;
        }


        .circle-one {

            width:
                90px;

            height:
                90px;

            left:
                -35px;

            top:
                48%;
        }


        .circle-two {

            width:
                120px;

            height:
                120px;

            right:
                -50px;

            top:
                52%;
        }


        /* =====================================================
           PETITS POINTS
        ===================================================== */

        .dots {

            position:
                fixed;

            width:
                120px;

            height:
                120px;

            pointer-events:
                none;

            z-index:
                0;
        }


        .dots span {

            position:
                absolute;

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--jaune);

            opacity:
                0.45;
        }


        .dots-left {

            left:
                -5px;

            top:
                66%;
        }


        .dots-right {

            right:
                -5px;

            top:
                38%;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {


            .page {

                width:
                    94%;

                padding-top:
                    30px;
            }


            .titre {

                padding:
                    45px 5px 45px;
            }


            .titre h1 {

                font-size:
                    55px;
            }


            .titre p {

                font-size:
                    18px;
            }


            .fiches {

                grid-template-columns:
                    repeat(2, 1fr);

                gap:
                    16px;
            }


            .pdf {

                min-height:
                    120px;

                padding:
                    18px 10px;

                font-size:
                    20px;

                border-radius:
                    24px;
            }


            .pdf-icon {

                width:
                    28px;

                height:
                    28px;

                right:
                    10px;

                top:
                    8px;
            }


            /* Décorations plus petites sur téléphone */

            .medical-deco {

                opacity:
                    0.20;
            }


            .stethoscope {

                width:
                    85px;

                height:
                    105px;

                left:
                    -30px;

                top:
                    22%;
            }


            .ecg {

                width:
                    120px;

                height:
                    55px;

                right:
                    -30px;

                top:
                    30%;
            }


            .xray {

                width:
                    75px;

                height:
                    95px;

                left:
                    -18px;

                bottom:
                    23%;
            }


            .bone {

                width:
                    90px;

                height:
                    65px;

                right:
                    -25px;

                bottom:
                    21%;
            }


            .cross {

                width:
                    50px;

                height:
                    50px;

                right:
                    8%;

                top:
                    14%;
            }


            .syringe {

                width:
                    90px;

                height:
                    50px;

                left:
                    5%;

                bottom:
                    7%;
            }


            .deco-circle {

                opacity:
                    0.18;
            }


            body::before {

                width:
                    700px;

                height:
                    700px;

                opacity:
                    0.045;
            }

        }

    </style>

</head>
