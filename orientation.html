<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Métier & Orientation — CESIREVISE</title>

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>

        :root {

            --jaune: #FFD230;

            --jaune-pale: #FFF7D6;

            --jaune-transparent:
                rgba(255, 210, 48, 0.18);

            --jaune-ombre:
                rgba(255, 210, 48, 0.12);

            --bleu:
                #77A5AA;

            --noir:
                #202020;

            --blanc:
                #FFFFFF;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 210, 48, 0.18),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 210, 48, 0.14),
                    transparent 30%
                ),

                var(--jaune-pale);

            color: var(--noir);

            font-family:
                "League Spartan",
                sans-serif;

            overflow-x: hidden;

            position: relative;
        }


        /* =====================================================
           GRAND LOGO EN FOND
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 1150px;
            height: 1150px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background-image:
                url("logo-cesirevise.png");

            background-repeat: no-repeat;

            background-position: center;

            background-size: contain;

            opacity: 0.055;

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           CONTENU
        ===================================================== */

        .page {

            position: relative;

            z-index: 1;

            width:
                min(1150px, 92%);

            margin: 0 auto;

            padding:
                60px 0 100px;
        }


        /* =====================================================
           RETOUR
        ===================================================== */

        .retour {

            display: inline-flex;

            align-items: center;

            padding:
                12px 22px;

            border-radius: 30px;

            background:
                rgba(255, 255, 255, 0.78);

            color:
                var(--noir);

            text-decoration: none;

            font-weight: 600;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .retour:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.12);
        }


        /* =====================================================
           TITRE
        ===================================================== */

        .titre {

            text-align: center;

            padding:
                55px 15px 60px;
        }


        .titre h1 {

            margin: 0;

            font-family:
                "Baloo 2",
                cursive;

            font-size:
                clamp(55px, 9vw, 105px);

            line-height: 0.9;

            color:
                var(--jaune);

            letter-spacing:
                -2px;

            transform:
                rotate(-2deg);

            text-shadow:

                3px 3px 0
                rgba(255, 255, 255, 0.85),

                7px 8px 0
                rgba(119, 165, 170, 0.12);
        }


        .titre p {

            margin:
                22px auto 0;

            max-width:
                700px;

            font-size:
                20px;

            line-height:
                1.5;

            opacity:
                0.85;
        }


        /* =====================================================
           LISTE DES FICHES
        ===================================================== */

        .fiches {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                28px;

            padding:
                10px 0;
        }


        /* =====================================================
           CASES PDF
        ===================================================== */

        .pdf {

            position: relative;

            min-height:
                155px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                25px;

            border-radius:
                30px;

            background:
                rgba(255, 255, 255, 0.90);

            border:
                3px solid
                rgba(255, 210, 48, 0.75);

            color:
                var(--noir);

            text-decoration: none;

            font-size:
                25px;

            font-weight:
                700;

            text-align:
                center;

            box-shadow:

                0 12px 25px
                rgba(0, 0, 0, 0.10),

                8px 8px 0
                var(--jaune-ombre);

            transition:

                transform 0.3s ease,

                box-shadow 0.3s ease,

                background 0.3s ease;
        }


        .pdf:hover {

            transform:
                translateY(-7px)
                rotate(-1deg);

            background:
                var(--blanc);

            box-shadow:

                0 20px 35px
                rgba(0, 0, 0, 0.15),

                10px 10px 0
                rgba(255, 210, 48, 0.20);
        }


        .pdf:nth-child(3n) {

            border-radius:
                38px 26px 34px 28px;
        }


        .pdf:nth-child(3n + 1) {

            border-radius:
                26px 38px 28px 34px;
        }


        .pdf:nth-child(4n) {

            transform:
                rotate(0.8deg);
        }


        .pdf:nth-child(4n):hover {

            transform:
                translateY(-7px)
                rotate(1.5deg);
        }


        /* =====================================================
           PETITS ÉLÉMENTS MÉDICAUX
        ===================================================== */

        .medical-deco {

            position: fixed;

            z-index: 0;

            pointer-events: none;

            color:
                var(--jaune);

            opacity:
                0.55;

            font-family:
                "Baloo 2",
                sans-serif;

            font-weight:
                800;

            user-select:
                none;
        }


        /* Stéthoscope */

        .stethoscope {

            left:
                2%;

            top:
                24%;

            font-size:
                62px;

            transform:
                rotate(-18deg);
        }


        /* Cœur */

        .heart {

            right:
                5%;

            top:
                19%;

            font-size:
                65px;

            transform:
                rotate(12deg);
        }


        /* Radio */

        .xray {

            left:
                4%;

            bottom:
                23%;

            font-size:
                58px;

            transform:
                rotate(-10deg);
        }


        /* Squelette */

        .skeleton {

            right:
                3%;

            bottom:
                18%;

            font-size:
                64px;

            transform:
                rotate(10deg);
        }


        /* Croix */

        .cross {

            right:
                15%;

            top:
                43%;

            font-size:
                45px;

            transform:
                rotate(-8deg);
        }


        /* ECG */

        .ecg {

            left:
                13%;

            top:
                12%;

            font-size:
                38px;

            transform:
                rotate(-4deg);

            letter-spacing:
                2px;
        }


        /* Petit cœur bas */

        .small-heart {

            right:
                15%;

            bottom:
                8%;

            font-size:
                38px;

            transform:
                rotate(15deg);
        }


        /* =====================================================
           PETITS CERCLES DÉCORATIFS
        ===================================================== */

        .deco-circle {

            position: fixed;

            border-radius:
                50%;

            pointer-events:
                none;

            z-index:
                0;

            border:
                4px solid
                var(--jaune);

            opacity:
                0.45;
        }


        .circle-one {

            width:
                80px;

            height:
                80px;

            left:
                -25px;

            top:
                48%;
        }


        .circle-two {

            width:
                105px;

            height:
                105px;

            right:
                -45px;

            top:
                58%;
        }


        /* =====================================================
           PETITS POINTS
        ===================================================== */

        .dots {

            position: fixed;

            width:
                120px;

            height:
                120px;

            pointer-events:
                none;

            z-index:
                0;
        }


        .dots span {

            position:
                absolute;

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                var(--jaune);

            opacity:
                0.55;
        }


        .dots-left {

            left:
                -10px;

            top:
                68%;
        }


        .dots-right {

            right:
                -15px;

            top:
                33%;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {


            .page {

                width:
                    94%;

                padding-top:
                    30px;
            }


            .titre {

                padding:
                    45px 5px 45px;
            }


            .titre h1 {

                font-size:
                    58px;
            }


            .titre p {

                font-size:
                    18px;
            }


            .fiches {

                grid-template-columns:
                    repeat(2, 1fr);

                gap:
                    16px;
            }


            .pdf {

                min-height:
                    120px;

                padding:
                    18px 10px;

                font-size:
                    20px;

                border-radius:
                    24px;
            }


            /* Décorations plus discrètes */

            .medical-deco {

                opacity:
                    0.32;

                transform:
                    scale(.65);
            }


            .stethoscope {

                left:
                    -20px;

                top:
                    25%;
            }


            .heart {

                right:
                    -20px;

                top:
                    17%;
            }


            .xray {

                left:
                    -15px;

                bottom:
                    25%;
            }


            .skeleton {

                right:
                    -20px;

                bottom:
                    20%;
            }


            .cross {

                right:
                    5%;

                top:
                    45%;
            }


            .ecg {

                left:
                    5%;

                top:
                    13%;
            }


            .small-heart {

                right:
                    5%;

                bottom:
                    9%;
            }


            body::before {

                width:
                    700px;

                height:
                    700px;

                opacity:
                    0.045;
            }


            .deco-circle {

                opacity:
                    0.25;
            }

        }

    </style>

</head>


<body>

        <!-- =================================================

    </main>


</body>
</html>
