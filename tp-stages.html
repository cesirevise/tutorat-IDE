<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP / Stage — CESIREVISE</title>
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF914D;
            --orange-pale: #FFF0E5;
            --noir: #171717;
            --blanc: #FFFFFF;
        }
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 145, 77, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 145, 77, 0.12),
                    transparent 30%
                ),
                var(--orange-pale);
            color: var(--noir);
            font-family: "League Spartan", sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        /* =====================================================
           GRAND LOGO EN FOND
        ===================================================== */
        body::before {
            content: "";
            position: fixed;
            width: 1150px;
            height: 1150px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-image: url("logo-cesirevise.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.055;
            pointer-events: none;
            z-index: 0;
        }
        /* =====================================================
           PAGE
        ===================================================== */
        .page {
            position: relative;
            z-index: 1;
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 50px 0 100px;
        }
        /* =====================================================
           BOUTON RETOUR
        ===================================================== */
        .retour {
            display: inline-flex;
            align-items: center;
            padding: 12px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.82);
            color: var(--noir);
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.08);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                color 0.25s ease;
        }
        .retour:hover {
            transform: translateY(-3px);
            color: var(--orange);
            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.12);
        }
        /* =====================================================
           TITRE
        ===================================================== */
        .titre {
            text-align: center;
            padding: 55px 10px 55px;
            width: 100%;
            overflow: hidden;
        }
        .titre h1 {
            margin: 0;
            font-family: "Baloo 2", cursive;
            font-size: clamp(55px, 9vw, 110px);
            line-height: 0.95;
            color: var(--orange);
            letter-spacing: -2px;
            transform: rotate(-2deg);
            text-shadow:
                3px 3px 0 rgba(255, 255, 255, 0.9),
                7px 8px 0 rgba(255, 145, 77, 0.12);
        }
        .titre p {
            margin: 22px auto 0;
            max-width: 700px;
            font-size: 20px;
            line-height: 1.5;
            opacity: 0.85;
        }
        /* =====================================================
           LISTE DES FICHES
        ===================================================== */
        .fiches {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
            padding: 10px 0;
        }
        /* =====================================================
           CARTES PDF
        ===================================================== */
        .pdf {
            min-height: 135px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.90);
            border: 3px solid rgba(255, 145, 77, 0.42);
            color: var(--orange);
            text-decoration: none;
            font-size: 25px;
            font-weight: 700;
            text-align: center;
            line-height: 1.15;
            overflow-wrap: anywhere;
            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.10),
                8px 8px 0 rgba(255, 145, 77, 0.12);
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }
        .pdf:hover {
            transform:
                translateY(-7px)
                rotate(-1deg);
            background: var(--blanc);
            box-shadow:
                0 20px 35px rgba(0, 0, 0, 0.15),
                10px 10px 0 rgba(255, 145, 77, 0.18);
        }
        .pdf:nth-child(odd) {
            border-radius: 28px 38px 30px 35px;
        }
        .pdf:nth-child(even) {
            border-radius: 38px 27px 35px 30px;
        }
        /* =====================================================
           DÉCORATIONS
        ===================================================== */
        .deco-circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .deco-circle.one {
            width: 90px;
            height: 90px;
            background: rgba(255, 145, 77, 0.12);
            top: 15%;
            left: -30px;
        }
        .deco-circle.two {
            width: 130px;
            height: 130px;
            background: rgba(255, 145, 77, 0.10);
            right: -45px;
            top: 42%;
        }
        .deco-circle.three {
            width: 65px;
            height: 65px;
            background: rgba(255, 145, 77, 0.16);
            left: 5%;
            bottom: 12%;
        }
        /* =====================================================
           ILLUSTRATIONS MÉDICALES
        ===================================================== */
        .medical-deco {
            position: fixed;
            color: var(--orange);
            opacity: 0.48;
            pointer-events: none;
            z-index: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* COIFFE */
        .nurse-cap {
            width: 115px;
            top: 7%;
            left: 3%;
            transform: rotate(-12deg);
            animation: floatCap 6s ease-in-out infinite;
        }
        /* SERINGUE */
        .syringe {
            width: 135px;
            top: 18%;
            right: 3%;
            transform: rotate(25deg);
            animation: floatSyringe 6s ease-in-out infinite;
        }
        /* PERFUSION */
        .perfusion {
            width: 105px;
            top: 50%;
            left: 1%;
            transform: rotate(-7deg);
            animation: floatPerfusion 6s ease-in-out infinite;
        }
        /* CISEAUX */
        .scissors {
            width: 110px;
            bottom: 12%;
            right: 3%;
            transform: rotate(15deg);
            animation: floatScissors 5.5s ease-in-out infinite;
        }
        /* PANSEMENT */
        .bandage {
            width: 75px;
            bottom: 6%;
            left: 28%;
            transform: rotate(-18deg);
            opacity: 0.30;
            animation: floatBandage 5s ease-in-out infinite;
        }
        /* =====================================================
           PETITES ÉTOILES
        ===================================================== */
        .spark {
            position: fixed;
            color: var(--orange);
            font-family: "Baloo 2", cursive;
            font-size: 40px;
            font-weight: 800;
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .spark.one {
            top: 30%;
            left: 7%;
            transform: rotate(12deg);
        }
        .spark.two {
            right: 15%;
            bottom: 30%;
            transform: rotate(-18deg);
        }
        /* =====================================================
           ANIMATIONS
        ===================================================== */
        @keyframes floatCap {
            0%, 100% {
                transform: rotate(-12deg) translateY(0);
            }
            50% {
                transform: rotate(-8deg) translateY(-10px);
            }
        }
        @keyframes floatSyringe {
            0%, 100% {
                transform: rotate(25deg) translateY(0);
            }
            50% {
                transform: rotate(29deg) translateY(-10px);
            }
        }
        @keyframes floatPerfusion {
            0%, 100% {
                transform: rotate(-7deg) translateY(0);
            }
            50% {
                transform: rotate(-4deg) translateY(-10px);
            }
        }
        @keyframes floatScissors {
            0%, 100% {
                transform: rotate(15deg) translateY(0);
            }
            50% {
                transform: rotate(19deg) translateY(-10px);
            }
        }
        @keyframes floatBandage {
            0%, 100% {
                transform: rotate(-18deg) translateY(0);
            }
            50% {
                transform: rotate(-14deg) translateY(-8px);
            }
        }
        /* =====================================================
           MOBILE
        ===================================================== */
        @media (max-width: 700px) {
            body {
                overflow-x: hidden;
            }
            body::before {
                width: 700px;
                height: 700px;
                opacity: 0.045;
            }
            .page {
                width: calc(100% - 32px);
                padding:
                    25px 0
                    70px;
            }
            /* RETOUR */
            .retour {
                padding: 11px 17px;
                font-size: 16px;
                white-space: nowrap;
            }
            /* TITRE */
            .titre {
                padding:
                    45px 0
                    40px;
            }
            .titre h1 {
                font-size: clamp(48px, 15vw, 68px);
                letter-spacing: -1.5px;
                line-height: 0.95;
                white-space: nowrap;
            }
            .titre p {
                margin-top: 20px;
                padding: 0 5px;
                font-size: 18px;
                line-height: 1.45;
            }
            /* FICHES */
            .fiches {
                grid-template-columns: 1fr;
                gap: 18px;
                width: 100%;
            }
            .pdf {
                min-height: 115px;
                width: 100%;
                padding:
                    20px 16px;
                font-size: 21px;
                line-height: 1.1;
                border-width: 2px;
                box-shadow:
                    0 9px 20px rgba(0, 0, 0, 0.09),
                    6px 6px 0 rgba(255, 145, 77, 0.12);
            }
            /* DÉCORATIONS */
            .medical-deco {
                opacity: 0.20;
            }
            .deco-circle.one {
                width: 65px;
                height: 65px;
                left: -30px;
            }
            .deco-circle.two {
                width: 90px;
                height: 90px;
                right: -40px;
            }
            .deco-circle.three {
                width: 45px;
                height: 45px;
                left: 5%;
            }
            /* ILLUSTRATIONS MOBILES */
            .nurse-cap {
                width: 75px;
                left: -12px;
                top: 8%;
            }
            .syringe {
                width: 85px;
                right: -15px;
                top: 17%;
            }
            .perfusion {
                width: 65px;
                left: -12px;
                top: 48%;
            }
            .scissors {
                width: 70px;
                right: -10px;
                bottom: 12%;
            }
            .bandage {
                width: 50px;
                left: 5%;
                bottom: 5%;
            }
            /* ÉTOILES */
            .spark {
                font-size: 28px;
                opacity: 0.28;
            }
            .spark.one {
                left: 4%;
                top: 31%;
            }
            .spark.two {
                right: 7%;
                bottom: 28%;
            }
        }
        /* =====================================================
           TRÈS PETITS TÉLÉPHONES
        ===================================================== */
        @media (max-width: 380px) {
            .page {
                width: calc(100% - 24px);
            }
            .titre {
                padding-top: 40px;
            }
            .titre h1 {
                font-size: 46px;
                letter-spacing: -1px;
            }
            .titre p {
                font-size: 17px;
            }
            .pdf {
                min-height: 105px;
                font-size: 19px;
                padding: 18px 12px;
            }
            .nurse-cap {
                width: 65px;
                left: -15px;
            }
            .syringe {
                width: 70px;
                right: -15px;
            }
            .perfusion {
                width: 55px;
                left: -12px;
            }
            .scissors {
                width: 60px;
                right: -12px;
            }
        }
    </style>
</head>
<body>
    <!-- =====================================================
         DÉCORATIONS
    ===================================================== -->
    <span class="deco-circle one"></span>
    <span class="deco-circle two"></span>
    <span class="deco-circle three"></span>
    <span class="spark one">✦</span>
    <span class="spark two">✦</span>
    <!-- =====================================================
         COIFFE INFIRMIÈRE
    ===================================================== -->
    <svg
        class="medical-deco nurse-cap"

        aria-hidden="true">
        <path d="
            M20 45

        <path d="
            M45 38

        "/>
    </svg>
    <!-- =====================================================
         SERINGUE
    ===================================================== -->
    <svg
        class="medical-deco syringe"
        viewBox="0 0 150 80"
        aria-hidden="true">
        <rect x="35" y="25" width="75" height="30" rx="4"/>
        <line x1="20" y1="25" x2="20" y2="55"/>
        <line x1="10" y1="25" x2="30" y2="25"/>
        <line x1="10" y1="55" x2="30" y2="55"/>
        <line x1="110" y1="32" x2="130" y2="32"/>
        <line x1="110" y1="48" x2="130" y2="48"/>
        <line x1="130" y1="40" x2="145" y2="40"/>
        <line x1="55" y1="25" x2="55" y2="55"/>
        <line x1="75" y1="25" x2="75" y2="55"/>
        <line x1="45" y1="35" x2="50" y2="35"/>
        <line x1="45" y1="45" x2="50" y2="45"/>
    </svg>
    <!-- =====================================================
         PERFUSION
    ===================================================== -->
    <svg
        class="medical-deco perfusion"
        viewBox="0 0 100 160"
        aria-hidden="true">
        <path d="
            M25 15
            Q50 5 75 15
            L70 90
            Q50 105 30 90

        "/>
        <line x1="50" y1="100" x2="50" y2="135"/>
        <path d="
            M50 135

        <line x1="42" y1="48" x2="58" y2="48"/>
        <path d="
            M42 48

        "/>
        <circle cx="50" cy="35" r="5"/>
    </svg>
    <!-- =====================================================
         CISEAUX
    ===================================================== -->
    <svg
        class="medical-deco scissors"
        viewBox="0 0 130 100"
        aria-hidden="true">
        <circle cx="32" cy="70" r="14"/>
        <circle cx="32" cy="30" r="14"/>
        <path d="
            M43 35
            L105 75
            L112 68
            L50 28
        "/>
        <path d="
            M43 65

            L50 72
        "/>
    </svg>
    <!-- =====================================================
         PANSEMENT
    ===================================================== -->
    <svg
        class="medical-deco bandage"
        viewBox="0 0 100 60"
        aria-hidden="true">
        <rect
            x="10"
            y="20"
            width="80"
            height="20"
            rx="10"
            transform="rotate(-20 50 30)"
        />
        <circle cx="50" cy="30" r="8"/>
        <line x1="32" y1="23" x2="40" y2="21"/>
        <line x1="60" y1="39" x2="68" y2="37"/>
    </svg>
    <!-- =====================================================
         CONTENU
    ===================================================== -->
    <main class="page">
        <!-- RETOUR -->
        <a href="fiches.html" class="retour">
            ← Retour aux fiches
        </a>
        <!-- TITRE -->
        <section class="titre">
            <h1>TP / STAGE</h1>
            <p>
                Tes fiches pour apprendre les gestes techniques,
                préparer tes stages et développer ta pratique infirmière.
            </p>
        </section>
        <!-- =================================================
             FICHES
        ================================================= -->
        <section class="fiches">
            <a href="tp-antiseptique.pdf" class="pdf">
                ANTISEPTIQUES
            </a>
            <a href="#" class="pdf">
                EHPAD
            </a>
        </section>
    </main>
</body>
</html>
