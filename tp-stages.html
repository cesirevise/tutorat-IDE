<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TP / Stage — CESIREVISE</title>

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>

        :root {
            --orange: #FF914D;
            --orange-pale: #FFF0E5;
            --orange-transparent: rgba(255, 145, 77, 0.18);
            --orange-ombre: rgba(255, 145, 77, 0.12);

            --noir: #171717;
            --blanc: #FFFFFF;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 145, 77, 0.16),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 145, 77, 0.12),
                    transparent 30%
                ),
                var(--orange-pale);

            color: var(--noir);

            font-family: "League Spartan", sans-serif;

            overflow-x: hidden;

            position: relative;
        }


        /* =====================================================
           GRAND LOGO EN FOND
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 1150px;
            height: 1150px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background-image: url("logo-cesirevise.png");

            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;

            opacity: 0.055;

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================================
           CONTENU
        ===================================================== */

        .page {

            position: relative;

            z-index: 1;

            width: min(1150px, 92%);

            margin: 0 auto;

            padding: 60px 0 100px;
        }


        /* =====================================================
           RETOUR
        ===================================================== */

        .retour {

            display: inline-flex;

            align-items: center;

            padding: 12px 22px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.78);

            color: var(--noir);

            text-decoration: none;

            font-weight: 600;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                color 0.25s ease;
        }


        .retour:hover {

            transform: translateY(-3px);

            color: var(--orange);

            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }


        /* =====================================================
           TITRE
        ===================================================== */

        .titre {

            text-align: center;

            padding: 55px 15px 60px;

            position: relative;
        }


        .titre h1 {

            margin: 0;

            font-family: "Baloo 2", cursive;

            font-size: clamp(65px, 10vw, 115px);

            line-height: 0.9;

            color: var(--orange);

            letter-spacing: -2px;

            transform: rotate(-2deg);

            text-shadow:
                3px 3px 0 rgba(255, 255, 255, 0.85),
                7px 8px 0 rgba(255, 145, 77, 0.12);
        }


        .titre p {

            margin: 22px auto 0;

            max-width: 700px;

            font-size: 20px;

            line-height: 1.5;

            opacity: 0.85;
        }


        /* =====================================================
           LISTE DES FICHES
        ===================================================== */

        .fiches {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 28px;

            padding: 10px 0;
        }


        /* =====================================================
           RECTANGLES / FICHES
        ===================================================== */

        .pdf {

            min-height: 125px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.88);

            border: 3px solid rgba(255, 145, 77, 0.42);

            color: var(--orange);

            text-decoration: none;

            font-size: 25px;

            font-weight: 700;

            text-align: center;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.10),
                8px 8px 0 rgba(255, 145, 77, 0.12);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        .pdf:hover {

            transform:
                translateY(-7px)
                rotate(-1deg);

            background: var(--blanc);

            box-shadow:
                0 20px 35px rgba(0, 0, 0, 0.15),
                10px 10px 0 rgba(255, 145, 77, 0.18);
        }


        .pdf:nth-child(3n) {

            border-radius: 38px 26px 34px 28px;
        }


        .pdf:nth-child(3n + 1) {

            border-radius: 26px 38px 28px 34px;
        }


        .pdf:nth-child(4n) {

            transform: rotate(0.8deg);
        }


        .pdf:nth-child(4n):hover {

            transform:
                translateY(-7px)
                rotate(1.5deg);
        }


        /* =====================================================
           PETITS ÉLÉMENTS DÉCORATIFS
        ===================================================== */

        .deco {

            position: fixed;

            pointer-events: none;

            z-index: 0;

            color: var(--orange);
        }


        /* -------------------------
           RONDS
        ------------------------- */

        .deco-circle {

            border-radius: 50%;

            position: fixed;

            pointer-events: none;

            z-index: 0;
        }


        .deco-circle.one {

            width: 90px;
            height: 90px;

            background: rgba(255, 145, 77, 0.12);

            top: 15%;
            left: -30px;
        }


        .deco-circle.two {

            width: 130px;
            height: 130px;

            background: rgba(255, 145, 77, 0.10);

            right: -45px;
            top: 42%;
        }


        .deco-circle.three {

            width: 65px;
            height: 65px;

            background: rgba(255, 145, 77, 0.16);

            left: 5%;
            bottom: 12%;
        }


        /* =====================================================
           ILLUSTRATIONS MÉDICALES
        ===================================================== */

        .medical-deco {

            position: fixed;

            color: var(--orange);

            opacity: 0.55;

            pointer-events: none;

            z-index: 0;

            fill: none;

            stroke: currentColor;

            stroke-width: 3;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* -------------------------
           SERINGUE
        ------------------------- */

        .syringe {

            width: 135px;

            top: 18%;
            right: 3%;

            transform: rotate(25deg);
        }


        /* -------------------------
           PERFUSION
        ------------------------- */

        .perfusion {

            width: 105px;

            top: 50%;
            left: 1%;

            transform: rotate(-7deg);
        }


        /* -------------------------
           CISEAUX
        ------------------------- */

        .scissors {

            width: 110px;

            bottom: 12%;
            right: 3%;

            transform: rotate(15deg);
        }


        /* -------------------------
           COIFFE INFIRMIÈRE
        ------------------------- */

        .nurse-cap {

            width: 115px;

            top: 7%;
            left: 3%;

            transform: rotate(-12deg);
        }


        /* -------------------------
           PANSEMENT
        ------------------------- */

        .bandage {

            width: 75px;

            bottom: 6%;
            left: 28%;

            transform: rotate(-18deg);

            opacity: 0.35;
        }


        /* =====================================================
           PETITES ÉTOILES / TRAITS
        ===================================================== */

        .spark {

            position: fixed;

            color: var(--orange);

            font-family: "Baloo 2", cursive;

            font-size: 40px;

            font-weight: 800;

            opacity: 0.45;

            pointer-events: none;

            z-index: 0;
        }


        .spark.one {

            top: 30%;
            left: 7%;

            transform: rotate(12deg);
        }


        .spark.two {

            right: 15%;
            bottom: 30%;

            transform: rotate(-18deg);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .page {

                width: 94%;

                padding-top: 30px;
            }


            .titre {

                padding: 45px 5px 45px;
            }


            .titre h1 {

                font-size: 58px;
            }


            .titre p {

                font-size: 18px;
            }


            .fiches {

                grid-template-columns: repeat(2, 1fr);

                gap: 16px;
            }


            .pdf {

                min-height: 115px;

                padding: 18px 10px;

                font-size: 20px;

                border-radius: 24px;
            }


            body::before {

                width: 700px;
                height: 700px;

                opacity: 0.045;
            }


            /* Décorations plus discrètes sur téléphone */

            .medical-deco {

                opacity: 0.22;
            }


            .syringe {

                width: 85px;

                top: 17%;
                right: -10px;
            }


            .perfusion {

                width: 70px;

                left: -10px;
                top: 47%;
            }


            .scissors {

                width: 75px;

                right: -5px;
                bottom: 10%;
            }


            .nurse-cap {

                width: 80px;

                left: -5px;
                top: 8%;
            }


            .bandage {

                width: 55px;

                left: 10%;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         ÉLÉMENTS DÉCORATIFS
    ===================================================== -->

    <span class="deco-circle one"></span>
    <span class="deco-circle two"></span>
    <span class="deco-circle three"></span>


    <!-- Petite étoile -->

    <span class="spark one">✦</span>
    <span class="spark two">✦</span>


    <!-- =====================================================
         COIFFE INFIRMIÈRE
    ===================================================== -->

    <svg
        class="medical-deco nurse-cap"
        viewBox="0 0 120 90"
        aria-hidden="true">

        <path d="M20 45
                 C25 22, 95 22, 100 45
                 L94 70
                 C72 77, 48 77, 26 70
                 Z"/>

        <path d="M45 38
                 L45 55
                 M36 46
                 L54 46"/>

        <path d="M20 45
                 C35 52, 82 52, 100 45"/>

    </svg>


    <!-- =====================================================
         SERINGUE
    ===================================================== -->

    <svg
        class="medical-deco syringe"
        viewBox="0 0 150 80"
        aria-hidden="true">

        <rect x="35" y="25" width="75" height="30" rx="4"/>

        <line x1="20" y1="25" x2="20" y2="55"/>
        <line x1="10" y1="25" x2="30" y2="25"/>
        <line x1="10" y1="55" x2="30" y2="55"/>

        <line x1="110" y1="32" x2="130" y2="32"/>
        <line x1="110" y1="48" x2="130" y2="48"/>

        <line x1="130" y1="40" x2="145" y2="40"/>

        <line x1="55" y1="25" x2="55" y2="55"/>
        <line x1="75" y1="25" x2="75" y2="55"/>

        <line x1="45" y1="35" x2="50" y2="35"/>
        <line x1="45" y1="45" x2="50" y2="45"/>

    </svg>


    <!-- =====================================================
         PERFUSION
    ===================================================== -->

    <svg
        class="medical-deco perfusion"
        viewBox="0 0 100 160"
        aria-hidden="true">

        <path d="M25 15
                 Q50 5 75 15
                 L70 90
                 Q50 105 30 90
                 Z"/>

        <line x1="50" y1="100" x2="50" y2="135"/>

        <path d="M50 135
                 C50 145, 35 145, 35 155"/>

        <line x1="42" y1="48" x2="58" y2="48"/>

        <path d="M42 48
                 C42 63, 58 63, 58 48"/>

        <circle cx="50" cy="35" r="5"/>

    </svg>


    <!-- =====================================================
         CISEAUX
    ===================================================== -->

    <svg
        class="medical-deco scissors"
        viewBox="0 0 130 100"
        aria-hidden="true">

        <circle cx="32" cy="70" r="14"/>
        <circle cx="32" cy="30" r="14"/>

        <path d="M43 35
                 L105 75
                 L112 68
                 L50 28"/>

        <path d="M43 65
                 L105 25
                 L112 32
                 L50 72"/>

    </svg>


    <!-- =====================================================
         PANSEMENT
    ===================================================== -->

    <svg
        class="medical-deco bandage"
        viewBox="0 0 100 60"
        aria-hidden="true">

        <rect
            x="10"
            y="20"
            width="80"
            height="20"
            rx="10"
            transform="rotate(-20 50 30)"/>

        <circle cx="50" cy="30" r="8"/>

        <line x1="32" y1="23" x2="40" y2="21"/>
        <line x1="60" y1="39" x2="68" y2="37"/>

    </svg>



    <!-- =====================================================
         PAGE
    ===================================================== -->

    <main class="page">


        <!-- RETOUR -->

        <a href="fiches.html" class="retour">
            ← Retour aux fiches
        </a>



        <!-- =================================================
             TITRE
        ================================================= -->

        <section class="titre">

            <h1>TP / STAGE</h1>

            <p>
                Tes fiches pour apprendre les gestes techniques,
                préparer tes stages et développer ta pratique infirmière.
            </p>

        </section>



        <!-- =================================================
             FICHES
        ================================================= -->

        <section class="fiches">


            <!-- 01 -->

            <a href="tp-antiseptiques.pdf" class="pdf">
                ANTISEPTIQUES
            </a>


            <!-- 02 -->

            <a href="#" class="pdf">
                EHPAD
            </a>

         </section>

    </main>


</body>
</html>
