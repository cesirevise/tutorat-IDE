<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forum des spécialités · CESIREVISE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bleu: #77A5AA;
            --blanc: #FFFFFF;
            --noir: #111111;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                "League Spartan",
                sans-serif;

            background: #111;
        }


        /* ==================================================
           CARROUSEL
        ================================================== */

        .carrousel {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            touch-action: pan-y;
        }


        .slides {

            display: flex;

            width: 100%;
            height: 100%;

            transition:
                transform 0.55s
                cubic-bezier(0.77, 0, 0.18, 1);
        }


        .slide {

            position: relative;

            flex: 0 0 100%;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background-size: cover;
            background-position: center;
        }


        /* ==================================================
           ASSOMBRISSEMENT DES PHOTOS
        ================================================== */

        .slide::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.12) 0%,
                    rgba(0,0,0,0.18) 45%,
                    rgba(0,0,0,0.62) 100%
                );

            pointer-events: none;
        }


        /* ==================================================
           CONTENU DU SLIDE
        ================================================== */

        .contenu-slide {

            position: absolute;

            z-index: 2;

            left: 0;
            right: 0;

            bottom: 105px;

            display: flex;

            justify-content: center;

            padding: 20px;
        }


        /* ==================================================
           BOUTON MÉTIER
        ================================================== */

        .bouton-metier {

            border:
                2px solid
                rgba(255,255,255,0.9);

            background:
                rgba(255,255,255,0.08);

            backdrop-filter: blur(5px);

            color: white;

            font-family:
                "League Spartan",
                sans-serif;

            font-size:
                clamp(30px, 5vw, 55px);

            font-weight: 800;

            letter-spacing: 0.5px;

            padding:
                14px 35px 17px;

            border-radius: 18px;

            cursor: pointer;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.5);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.18);

            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }


        .bouton-metier:hover {

            background:
                rgba(255,255,255,0.18);

            transform:
                scale(1.04);
        }


        .bouton-metier:active {

            transform:
                scale(0.97);
        }


        /* ==================================================
           POINTS
        ================================================== */

        .points {

            position: absolute;

            z-index: 5;

            bottom: 30px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .point {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            border: none;

            padding: 0;

            background:
                rgba(255,255,255,0.45);

            cursor: pointer;

            transition:
                width 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }


        .point.actif {

            width: 24px;

            border-radius: 10px;

            background: white;

            transform:
                scale(1.05);
        }


        /* ==================================================
           FICHE
           
           IMPORTANT :
           La fiche entière est FIXE.
           
           Le défilement est uniquement dans
           .fiche-contenu.
        ================================================== */

        .fiche {

            position: fixed;

            z-index: 20;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                #F5FAFA;

            transform:
                translateY(100%);

            transition:
                transform 0.65s
                cubic-bezier(0.77, 0, 0.18, 1);

            overflow: hidden;
        }


        .fiche.ouverte {

            transform:
                translateY(0);
        }


        /* ==================================================
           CONTENU QUI DÉFILE
           
           Le bouton RETOUR n'est PAS dedans.
        ================================================== */

        .fiche-contenu {

            width: 100%;

            height: 100%;

            padding:
                45px
                max(25px, 7vw)
                110px;

            max-width: 1000px;

            margin: 0 auto;

            overflow-y: auto;

            overflow-x: hidden;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior-y: contain;
        }


        /* ==================================================
           IMAGES DES FICHES
        ================================================== */

        .pages-ipde {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 18px;

            padding-bottom: 30px;
        }


        .pages-ipde img {

            display: block;

            width: 100%;

            max-width: 900px;

            height: auto;

            flex-shrink: 0;
        }


        /* ==================================================
           BOUTON X
           
           FIXE AU-DESSUS DE LA FICHE
        ================================================== */

        .fermer {

            position: fixed;

            z-index: 1000;

            top: 22px;
            right: 25px;

            width: 45px;
            height: 45px;

            border: none;

            border-radius: 50%;

            background:
                var(--bleu);

            color: white;

            font-size: 25px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.15);
        }


        /* ==================================================
           BOUTON RETOUR AU FORUM
           
           FIXE AU-DESSUS DES IMAGES.
           
           Il ne défile JAMAIS avec les fiches.
        ================================================== */

        .bouton-retour-forum {

            position: fixed;

            z-index: 1000;

            bottom: 25px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                12px 24px;

            border: none;

            border-radius: 14px;

            background:
                var(--bleu);

            color: white;

            font-family:
                "League Spartan",
                sans-serif;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;

            box-shadow:
                0 6px 18px
                rgba(0,0,0,0.22);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .bouton-retour-forum:hover {

            background:
                #66969B;

            transform:
                translateX(-50%)
                translateY(-2px);
        }


        .bouton-retour-forum:active {

            transform:
                translateX(-50%)
                scale(0.97);
        }

        /* ==================================================
   BOUTON RETOUR À L'ACCUEIL
================================================== */

.bouton-retour-accueil {

    position: fixed;

    z-index: 10;

    top: 22px;
    left: 25px;

    padding: 11px 20px;

    border: none;

    border-radius: 14px;

    background: rgba(255,255,255,0.92);

    color: var(--bleu);

    font-family:
        "League Spartan",
        sans-serif;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.18);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.bouton-retour-accueil:hover {

    background: white;

    transform:
        translateY(-2px);
}

.bouton-retour-accueil:active {

    transform:
        scale(0.97);
}


/* Sur téléphone */

@media (max-width: 700px) {

    .bouton-retour-accueil {

        top: 16px;
        left: 16px;

        padding:
            9px 15px;

        font-size: 15px;
    }

}

        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {

            .contenu-slide {

                bottom: 90px;
            }


            .bouton-metier {

                font-size: 30px;

                padding:
                    12px 27px 15px;
            }


            .points {

                bottom: 25px;
            }


            .fiche-contenu {

                padding:
                    35px
                    22px
                    100px;
            }


            .bouton-retour-forum {

                bottom: 18px;

                padding:
                    11px 20px;

                font-size: 17px;
            }


            .fermer {

                top: 16px;

                right: 16px;
            }
        }

    </style>

</head>


<body>
<a
    href="index.html"
    class="bouton-retour-accueil"
>
    ← Retour à l’accueil
</a>

<!-- =====================================================
     FORUM / CARROUSEL
===================================================== -->

<div class="carrousel">

    <div
        class="slides"
        id="slides"
    >


        <!-- IADE -->

        <section
            class="slide"
            style="
                background-image:
                url('photo-iade.jpg');
            "
            data-metier="IADE"
        >

            <div class="contenu-slide">

                <button
                    class="bouton-metier"
                    onclick="ouvrirFiche(0)"
                >
                    IADE
                </button>

            </div>

        </section>


        <!-- IBODE -->

        <section
            class="slide"
            style="
                background-image:
                url('photo-ibode.jpg');
            "
            data-metier="IBODE"
        >

            <div class="contenu-slide">

                <button
                    class="bouton-metier"
                    onclick="ouvrirFiche(1)"
                >
                    IBODE
                </button>

            </div>

        </section>


        <!-- STOMATHÉRAPEUTE -->

        <section
            class="slide"
            style="
                background-image:
                url('photo-stomatherapeute.png');
            "
            data-metier="STOMATHÉRAPEUTE"
        >

            <div class="contenu-slide">

                <button
                    class="bouton-metier"
                    onclick="ouvrirFiche(2)"
                >
                    STOMATHÉRAPEUTE
                </button>

            </div>

        </section>


        <!-- IPA -->

        <section
            class="slide"
            style="
                background-image:
                url('photo-ipa.jpg');
            "
            data-metier="IPA"
        >

            <div class="contenu-slide">

                <button
                    class="bouton-metier"
                    onclick="ouvrirFiche(3)"
                >
                    IPA
                </button>

            </div>

        </section>


        <!-- PERFUSIONNISTE -->

        <section
            class="slide"
            style="
                background-image:
                url('photo-perfusionniste.jpg');
            "
            data-metier="PERFUSIONNISTE"
        >

            <div class="contenu-slide">

                <button
                    class="bouton-metier"
                    onclick="ouvrirFiche(4)"
                >
                    PERFUSIONNISTE
                </button>

            </div>

        </section>


        <!-- IPDE -->

        <section
            class="slide"
            style="
                background-image:
                url('photo-ipde.jpg');
            "
            data-metier="IPDE"
        >

            <div class="contenu-slide">

                <button
                    class="bouton-metier"
                    onclick="ouvrirFiche(5)"
                >
                    IPDE
                </button>

            </div>

        </section>


    </div>


    <!-- =================================================
         POINTS
    ================================================== -->

    <div class="points">

        <button
            class="point"
            onclick="allerA(0)"
        ></button>

        <button
            class="point"
            onclick="allerA(1)"
        ></button>

        <button
            class="point"
            onclick="allerA(2)"
        ></button>

        <button
            class="point"
            onclick="allerA(3)"
        ></button>

        <button
            class="point"
            onclick="allerA(4)"
        ></button>

        <button
            class="point"
            onclick="allerA(5)"
        ></button>

    </div>

</div>


<!-- =====================================================
     FICHE
===================================================== -->

<div
    class="fiche"
    id="fiche"
>


    <!-- X FIXE -->

    <button
        class="fermer"
        onclick="fermerFiche()"
        aria-label="Fermer"
    >
        ×
    </button>


    <!-- =================================================
         CONTENU SCROLLABLE
         
         LES IMAGES DES FICHES SONT GÉNÉRÉES ICI.
    ================================================== -->

    <div
        class="fiche-contenu"
        id="contenuFiche"
    ></div>


    <!-- =================================================
         BOUTON FIXE
         
         IL EST EN DEHORS DE fiche-contenu.
         DONC IL NE PEUT PAS DÉFILER AVEC LES IMAGES.
    ================================================== -->

    <button
        class="bouton-retour-forum"
        onclick="fermerFiche()"
    >
        Retour au forum →
    </button>


</div>


<script>


    /* ==================================================
       DONNÉES
    ================================================== */

    const metiers = [

        "IADE",

        "IBODE",

        "STOMATHÉRAPEUTE",

        "IPA",

        "PERFUSIONNISTE",

        "IPDE"

    ];


    const nomsFichiers = [

        "iade",

        "ibode",

        "stomatherapeute",

        "ipa",

        "perfusionniste",

        "ipde"

    ];


    const nombrePages = [

        10,

        8,

        6,

        7,

        6,

        7

    ];


    /* ==================================================
       SLIDE ACTUEL
    ================================================== */

    let indexActuel =
        Math.floor(
            Math.random()
            * metiers.length
        );


    /* ==================================================
       ÉLÉMENTS
    ================================================== */

    const slides =
        document.getElementById(
            "slides"
        );


    const points =
        document.querySelectorAll(
            ".point"
        );


    const fiche =
        document.getElementById(
            "fiche"
        );


    const contenuFiche =
        document.getElementById(
            "contenuFiche"
        );


    /* ==================================================
       AFFICHER LE SLIDE
    ================================================== */

    function afficherSlide() {

        slides.style.transform =
            `translateX(-${indexActuel * 100}%)`;


        points.forEach(
            (point, index) => {

                point.classList.toggle(
                    "actif",
                    index === indexActuel
                );

            }
        );

    }


    /* ==================================================
       ALLER À UN SLIDE
    ================================================== */

    function allerA(index) {

        indexActuel = index;

        afficherSlide();

    }


    /* ==================================================
       SLIDE SUIVANT
    ================================================== */

    function suivant() {

        indexActuel++;

        if (
            indexActuel >=
            metiers.length
        ) {

            indexActuel = 0;

        }

        afficherSlide();

    }


    /* ==================================================
       SLIDE PRÉCÉDENT
    ================================================== */

    function precedent() {

        indexActuel--;

        if (
            indexActuel < 0
        ) {

            indexActuel =
                metiers.length - 1;

        }

        afficherSlide();

    }


    /* ==================================================
       OUVRIR UNE FICHE
    ================================================== */

    function ouvrirFiche(index) {

        const nom =
            nomsFichiers[index];


        const pages =
            nombrePages[index];


        /*
         * On remet le scroll en haut
         * à chaque nouvelle fiche.
         */

        contenuFiche.scrollTop = 0;


        /*
         * Construction des images.
         *
         * IMPORTANT :
         * On ne supprime aucun fichier.
         * On affiche simplement les images
         * correspondant au métier choisi.
         */

        let html = `
            <div class="pages-ipde">
        `;


        for (
            let i = 1;
            i <= pages;
            i++
        ) {

            html += `

                <img
                    src="./fiche-${i}-${nom}.jpg"
                    alt="
                        Fiche
                        ${metiers[index]}
                        - page ${i}
                    "
                >

            `;

        }


        html += `
            </div>
        `;


        contenuFiche.innerHTML =
            html;


        /*
         * Ouvre la fiche
         */

        fiche.classList.add(
            "ouverte"
        );

    }


    /* ==================================================
       FERMER LA FICHE
    ================================================== */

    function fermerFiche() {

        fiche.classList.remove(
            "ouverte"
        );

    }


    /* ==================================================
       SWIPE HORIZONTAL
    ================================================== */

    let debutX = 0;

    let debutY = 0;


    document.addEventListener(
        "touchstart",
        function(e) {

            /*
             * Si une fiche est ouverte,
             * le doigt sert à faire défiler
             * la fiche.
             *
             * On NE touche donc pas
             * au carrousel.
             */

            if (
                fiche.classList.contains(
                    "ouverte"
                )
            ) {

                return;

            }


            debutX =
                e.touches[0].clientX;


            debutY =
                e.touches[0].clientY;

        },
        {
            passive: true
        }
    );


    document.addEventListener(
        "touchend",
        function(e) {

            if (
                fiche.classList.contains(
                    "ouverte"
                )
            ) {

                return;

            }


            const finX =
                e.changedTouches[0].clientX;


            const finY =
                e.changedTouches[0].clientY;


            const distanceX =
                finX - debutX;


            const distanceY =
                finY - debutY;


            /*
             * Swipe uniquement horizontal
             */

            if (

                Math.abs(distanceX) > 60

                &&

                Math.abs(distanceX)
                >
                Math.abs(distanceY)

            ) {

                if (
                    distanceX < 0
                ) {

                    suivant();

                } else {

                    precedent();

                }

            }

        },
        {
            passive: true
        }
    );


    /* ==================================================
       SOURIS : GLISSER
    ================================================== */

    let sourisX = 0;

    let sourisEnCours = false;


    document.addEventListener(
        "mousedown",
        function(e) {

            if (
                fiche.classList.contains(
                    "ouverte"
                )
            ) {

                return;

            }


            sourisX =
                e.clientX;


            sourisEnCours =
                true;

        }
    );


    document.addEventListener(
        "mouseup",
        function(e) {

            if (
                !sourisEnCours
            ) {

                return;

            }


            sourisEnCours =
                false;


            if (
                fiche.classList.contains(
                    "ouverte"
                )
            ) {

                return;

            }


            const distance =
                e.clientX - sourisX;


            if (
                Math.abs(distance) > 70
            ) {

                if (
                    distance < 0
                ) {

                    suivant();

                } else {

                    precedent();

                }

            }

        }
    );


    /* ==================================================
       CLAVIER
    ================================================== */

    document.addEventListener(
        "keydown",
        function(e) {

            /*
             * Si la fiche est ouverte,
             * les flèches ne changent PAS
             * de métier.
             */

            if (
                fiche.classList.contains(
                    "ouverte"
                )
            ) {

                if (
                    e.key === "Escape"
                ) {

                    fermerFiche();

                }

                return;

            }


            if (
                e.key === "ArrowRight"
            ) {

                suivant();

            }


            if (
                e.key === "ArrowLeft"
            ) {

                precedent();

            }


            if (
                e.key === "ArrowUp"
            ) {

                ouvrirFiche(
                    indexActuel
                );

            }

        }
    );


    /* ==================================================
       INITIALISATION
    ================================================== */

    afficherSlide();


</script>


</body>
</html>
