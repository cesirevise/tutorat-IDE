<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CESI Révise – Tutorat IFSI Pontchaillou Rennes</title>

    <meta name="google-site-verification" content="googleb31f89011bd47473.html">   

<meta name="description" content="CESI Révise : espace de tutorat et de révision pour les étudiants infirmiers de l'IFSI Pontchaillou à Rennes. Fiches, ressources, forum et informations.">

<meta name="robots" content="index, follow">

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>

        :root {
            --bleu: #77A5AA;
            --bleu-clair: #EAF4F5;
            --bleu-tres-clair: #F5FAFA;
            --noir: #111111;
            --blanc: #FFFFFF;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;

            background: var(--bleu-tres-clair);

            color: var(--noir);

            font-family: "League Spartan", sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           BANDEAU DU HAUT
        ===================================================== */

        .bandeau {

            width: 100%;

            min-height: 105px;

            background: var(--bleu);

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 28px;

            padding: 18px 30px;

            position: relative;

            z-index: 10;

            box-shadow:
                0 8px 25px rgba(119, 165, 170, 0.20);
        }


        .bandeau::before {

            content: "";

            position: absolute;

            bottom: -18px;

            left: 0;

            width: 100%;

            height: 35px;

            background: var(--bleu);

            border-radius:
                0 0 50% 50%;
        }


        .bandeau img {

            width: 115px;

            height: auto;

            filter:
                brightness(0)
                invert(1);
        }


        .bandeau span {

            color: var(--blanc);

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 2.5px;

            text-transform: uppercase;
        }


        /* =====================================================
           PAGE PRINCIPALE
        ===================================================== */

        .page {

            position: relative;

            max-width: 1150px;

            margin: 0 auto;

            padding: 65px 30px 70px;
        }


        /* =====================================================
           DÉCORATIONS
        ===================================================== */

        .decorations {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        /* grand cercle complet */

        .cercle-gauche {

            position: absolute;

            width: 420px;

            height: 420px;

            border: 2px solid rgba(119, 165, 170, 0.17);

            border-radius: 50%;

            left: -310px;

            top: 270px;
        }


        .cercle-gauche::after {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            border: 2px solid rgba(119, 165, 170, 0.12);

            border-radius: 50%;

            left: 70px;

            top: 70px;
        }


        /* cercle droit */

        .cercle-droit {

            position: absolute;

            width: 330px;

            height: 330px;

            border: 2px solid rgba(119, 165, 170, 0.15);

            border-radius: 50%;

            right: -240px;

            top: 540px;
        }


        /* petite pastille */

        .pastille {

            position: absolute;

            width: 18px;

            height: 18px;

            background: var(--bleu);

            border-radius: 50%;

            opacity: 0.45;
        }


        .pastille.one {
            left: 7%;
            top: 190px;
        }


        .pastille.two {
            right: 9%;
            top: 430px;

            width: 12px;
            height: 12px;
        }


        .pastille.three {
            left: 10%;
            bottom: 180px;

            width: 10px;
            height: 10px;
        }


        /* =====================================================
           INTRO
        ===================================================== */

        .intro {

            position: relative;

            z-index: 2;

            text-align: center;

            padding: 35px 15px 45px;
        }


        .intro h1 {

            margin: 0;

            font-family: "Baloo 2", cursive;

            color: var(--bleu);

            font-size: clamp(55px, 8vw, 90px);

            line-height: 0.95;

            letter-spacing: -2px;

            transform: rotate(-2deg);

            text-shadow:
                4px 5px 0 rgba(119, 165, 170, 0.10);
        }


        .intro p {

            max-width: 650px;

            margin: 20px auto 0;

            padding: 18px 25px;

            background: rgba(255,255,255,0.82);

            border-radius: 28px;

            font-size: 18px;

            line-height: 1.45;

            box-shadow:
                0 12px 30px rgba(0,0,0,0.05);
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation {

            position: relative;

            z-index: 2;

            min-height: 760px;

            margin-top: 5px;
        }


        /* =====================================================
           VRAIES COURBES
        ===================================================== */

        .decor-line {

            position: absolute;

            border: 2px solid rgba(119,165,170,0.20);

            border-radius: 50%;

            pointer-events: none;
        }


        .decor-line.one {

            width: 360px;

            height: 180px;

            top: 55px;

            left: 23%;

            transform: rotate(8deg);
        }


        .decor-line.two {

            width: 300px;

            height: 150px;

            top: 375px;

            right: 18%;

            transform: rotate(-12deg);
        }


        /* =====================================================
           BULLES
        ===================================================== */

        .bulle {

            position: absolute;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            width: 285px;

            height: 190px;

            padding: 30px;

            color: var(--blanc);

            text-decoration: none;

            font-size: 31px;

            line-height: 1.05;

            font-weight: 700;

            z-index: 5;

            box-shadow:
                0 20px 35px rgba(0,0,0,0.14),
                inset 0 -10px 0 rgba(0,0,0,0.06);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        /* formes volontairement légèrement différentes */

        .fiches {

            top: 15px;

            left: 3%;

            background: var(--bleu);

            border-radius:
                48% 52% 45% 55% /
                55% 45% 55% 45%;

            transform: rotate(-3deg);
        }


        .conferences {

            top: 135px;

            right: 2%;

            background: var(--bleu);

            border-radius:
                52% 48% 55% 45% /
                45% 55% 45% 55%;

            transform: rotate(3deg);
        }


        .specialites {

            top: 325px;

            right: 7%;

            background: var(--bleu);

            border-radius:
                45% 55% 50% 50% /
                55% 45% 50% 50%;

            transform: rotate(-2deg);
        }


        .rejoindre {

            top: 440px;

            left: 5%;

            background: var(--bleu);

            border-radius:
                55% 45% 48% 52% /
                48% 52% 45% 55%;

            transform: rotate(3deg);
        }


        .contact {

            top: 600px;

            right: 8%;

            background: var(--bleu);

            border-radius:
                50% 50% 45% 55% /
                45% 55% 55% 45%;

            transform: rotate(-3deg);
        }


        .bulle:hover {

            transform:
                scale(1.08)
                rotate(0deg);

            box-shadow:
                0 28px 50px rgba(0,0,0,0.20),
                inset 0 -10px 0 rgba(0,0,0,0.07);
        }


        /* =====================================================
           PETITS POINTS SUR LA COMPOSITION
        ===================================================== */

        .mini {

            position: absolute;

            width: 13px;

            height: 13px;

            border-radius: 50%;

            background: var(--bleu);

            opacity: 0.55;

            z-index: 4;
        }


        .mini.a {

            top: 160px;

            left: 39%;
        }


        .mini.b {

            top: 315px;

            left: 24%;

            width: 9px;

            height: 9px;
        }


        .mini.c {

            top: 500px;

            right: 32%;

            width: 16px;

            height: 16px;
        }


        .mini.d {

            top: 650px;

            left: 42%;

            width: 8px;

            height: 8px;
        }


        /* =====================================================
           BAS
        ===================================================== */

        footer {

            text-align: center;

            padding: 20px 20px 50px;

            color: var(--bleu);

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 1px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .bandeau {

                min-height: 90px;

                gap: 14px;

                padding: 15px;
            }


            .bandeau img {

                width: 85px;
            }


            .bandeau span {

                font-size: 11px;

                letter-spacing: 1.4px;
            }


            .page {

                padding: 45px 15px 40px;
            }


            .intro {

                padding-bottom: 25px;
            }


            .intro h1 {

                font-size: 58px;
            }


            .intro p {

                font-size: 17px;

                padding: 16px 20px;
            }


            .navigation {

                min-height: 820px;
            }


            .bulle {

                width: 195px;

                height: 140px;

                font-size: 22px;

                padding: 20px;
            }


            .fiches {

                left: -5%;

                top: 5px;
            }


            .conferences {

                right: -5%;

                top: 125px;
            }


            .specialites {

                right: -5%;

                top: 295px;
            }


            .rejoindre {

                left: -5%;

                top: 420px;
            }


            .contact {

                right: -5%;

                top: 590px;
            }


            .decor-line.one {

                width: 240px;

                height: 120px;

                left: 20%;
            }


            .decor-line.two {

                width: 220px;

                height: 110px;

                right: 12%;

                top: 430px;
            }


            .cercle-gauche {

                width: 300px;

                height: 300px;

                left: -240px;
            }


            .cercle-droit {

                width: 250px;

                height: 250px;

                right: -200px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         BANDEAU
    ===================================================== -->

    <header class="bandeau">

        <img

        >

        </span>

    <!-- =====================================================

    <main class="page">

        <div class="decorations">

        </div>


        <!-- =================================================

        ================================================= -->

        <section class="intro">

            <h1>

            </h1>

            <p>

                étudiant·e·s infirmier·ère·s de Pontchaillou.

                <br>

                Réviser · s’orienter · partager · avancer

            </p>

        </section>


        <!-- =================================================

        ================================================= -->

        <section class="navigation">


            <!-- vraies formes -->

            <span class="decor-line one"></span>

            <span class="decor-line two"></span>


            <!-- petits points -->

            <span class="mini a"></span>

            <span class="mini b"></span>

            <span class="mini c"></span>

            <span class="mini d"></span>


            <!-- bulles -->

            <a href="fiches.html" class="bulle fiches">

            </a>


            <a href="#" class="bulle conferences">
                CONFÉRENCES
            </a>


            <a href="forum.html" class="bulle specialites">
                FORUM DES<br>
                SPÉCIALITÉS
            </a>


            <a href="#" class="bulle rejoindre">
                NOUS<br>

            </a>


            <a href="contacts.html" class="bulle contact">
                NOUS<br>

            </a>


        </section>


    </main>


    <footer>

        CESIREVISE · CESIR · IFSI PONTCHAILLOU

    </footer>


</body>
</html>
