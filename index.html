<style>

/* =========================================================
   BASE
========================================================= */

:root {
    --bleu: #77A5AA;
    --bleu-clair: #DDEEEF;

    --jaune: #FFD52A;
    --rouge: #D95B5B;
    --vert: #83AAA0;

    --fond: #F8F8F8;
    --noir: #111111;
    --blanc: #FFFFFF;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    background: var(--fond);

    color: var(--noir);

    font-family: "League Spartan", sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: relative;

    height: 105px;

    background: var(--blanc);

    display: flex;
    align-items: center;
    justify-content: center;

    border-bottom: 1px solid #111;
}


/*
Petit rappel graphique bleu
dans le coin supérieur droit
*/

header::after {
    content: "";

    position: absolute;

    width: 115px;
    height: 115px;

    right: -48px;
    top: -45px;

    background: var(--bleu);

    border-radius:
        50% 50% 50% 18%;
}


/* lignes dans le coin */

.header-lines {
    position: absolute;

    right: 15px;
    top: 18px;

    width: 95px;
    height: 60px;

    z-index: 2;
}

.header-lines::before,
.header-lines::after {
    content: "";

    position: absolute;

    width: 85px;
    height: 40px;

    border: 2px solid var(--bleu);

    border-left-color: transparent;
    border-bottom-color: transparent;

    border-radius: 60% 40% 50% 50%;

    transform: rotate(15deg);
}

.header-lines::before {
    top: 0;
    right: 0;
}

.header-lines::after {
    top: 12px;
    right: 8px;
}


.logo {
    width: 120px;

    height: auto;

    z-index: 3;
}


/* =========================================================
   POINTS
========================================================= */

.points {
    position: absolute;

    width: 90px;
    height: 90px;

    z-index: 1;
}

.points span {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--bleu);
}


/* première rangée */

.points span:nth-child(1) {
    left: 5px;
    top: 5px;
}

.points span:nth-child(2) {
    left: 20px;
    top: 2px;
}

.points span:nth-child(3) {
    left: 36px;
    top: 7px;
}

.points span:nth-child(4) {
    left: 53px;
    top: 3px;
}

.points span:nth-child(5) {
    left: 69px;
    top: 8px;
}


/* deuxième */

.points span:nth-child(6) {
    left: 12px;
    top: 20px;
}

.points span:nth-child(7) {
    left: 29px;
    top: 23px;
}

.points span:nth-child(8) {
    left: 47px;
    top: 19px;
}

.points span:nth-child(9) {
    left: 64px;
    top: 25px;
}


/* troisième */

.points span:nth-child(10) {
    left: 3px;
    top: 38px;
}

.points span:nth-child(11) {
    left: 21px;
    top: 43px;
}

.points span:nth-child(12) {
    left: 40px;
    top: 38px;
}

.points span:nth-child(13) {
    left: 59px;
    top: 45px;
}

.points span:nth-child(14) {
    left: 76px;
    top: 39px;
}


/* quatrième */

.points span:nth-child(15) {
    left: 12px;
    top: 59px;
}

.points span:nth-child(16) {
    left: 30px;
    top: 65px;
}

.points span:nth-child(17) {
    left: 48px;
    top: 59px;
}

.points span:nth-child(18) {
    left: 66px;
    top: 65px;
}


/* cinquième */

.points span:nth-child(19) {
    left: 5px;
    top: 78px;
}

.points span:nth-child(20) {
    left: 22px;
    top: 83px;
}

.points span:nth-child(21) {
    left: 41px;
    top: 77px;
}

.points span:nth-child(22) {
    left: 59px;
    top: 83px;
}


/* positions */

.points-top-right {
    right: 5%;
    top: 145px;
}

.points-middle-left {
    left: 3%;
    top: 430px;
}

.points-bottom-right {
    right: 4%;
    bottom: 260px;
}


/* =========================================================
   DÉCOR COINS
========================================================= */

.corner-shape {
    position: absolute;

    pointer-events: none;

    z-index: 0;
}


/* jaune haut gauche */

.yellow-corner {
    width: 145px;
    height: 145px;

    left: -72px;
    top: 180px;

    border: 3px solid var(--jaune);

    border-left: none;
    border-bottom: none;

    border-radius: 0 70% 0 0;

    transform: rotate(12deg);
}


/* rouge haut droite */

.red-corner {
    width: 150px;
    height: 150px;

    right: -72px;
    top: 360px;

    border: 4px solid var(--rouge);

    border-right: none;
    border-bottom: none;

    border-radius: 70% 0 0 0;

    transform: rotate(-12deg);
}


/* jaune bas gauche */

.yellow-bottom {
    width: 165px;
    height: 165px;

    left: -85px;
    bottom: 250px;

    border: 3px solid var(--jaune);

    border-left: none;
    border-bottom: none;

    border-radius: 0 75% 0 0;

    transform: rotate(-8deg);
}


/* =========================================================
   PAGE
========================================================= */

main {
    position: relative;

    width: min(1120px, 94%);

    margin: auto;

    padding-bottom: 70px;
}


/* =========================================================
   INTRO
========================================================= */

.intro {
    position: relative;

    text-align: center;

    padding: 70px 20px 40px;
}


/* petit élément graphique au-dessus */

.intro::before {
    content: "";

    position: absolute;

    width: 65px;
    height: 65px;

    left: 12%;
    top: 50px;

    border: 2px solid var(--bleu);

    border-radius:
        52% 48% 60% 40%;

    transform: rotate(-20deg);
}


.intro h1 {
    margin: 0;

    color: var(--bleu);

    font-size: clamp(58px, 9vw, 100px);

    line-height: .9;

    font-weight: 800;

    letter-spacing: -3px;
}


.intro p {
    max-width: 650px;

    margin: 28px auto 0;

    font-size: 20px;

    line-height: 1.45;

    font-weight: 400;
}


.intro strong {
    font-weight: 700;
}


/* =========================================================
   SERPENTIN
========================================================= */

.navigation {
    position: relative;

    min-height: 930px;

    margin-top: 10px;
}


/*
COURBES NOIRES

Elles sont volontairement petites
et viennent accompagner les bulles.
*/

.black-curve {
    position: absolute;

    width: 170px;
    height: 75px;

    border: 2px solid var(--noir);

    border-left: none;
    border-bottom: none;

    border-radius: 0 100% 0 0;
}


/* courbe 1 */

.curve-one {
    left: 28%;
    top: 130px;

    transform: rotate(22deg);
}


/* courbe 2 */

.curve-two {
    right: 27%;
    top: 325px;

    transform: rotate(158deg);
}


/* courbe 3 */

.curve-three {
    left: 27%;
    top: 530px;

    transform: rotate(20deg);
}


/* =========================================================
   BULLES
========================================================= */

.bulle {
    position: absolute;

    width: 290px;
    height: 190px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    background: var(--bleu);

    color: var(--blanc);

    text-decoration: none;

    font-size: 31px;

    line-height: 1.05;

    font-weight: 700;

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    box-shadow:
        0 12px 25px rgba(0,0,0,.10);
}


/*
Chaque bulle possède
une forme légèrement différente.
*/


/* FICHES */

.fiches {
    left: 4%;
    top: 15px;

    border-radius:
        47% 53% 50% 50% /
        54% 46% 57% 43%;

    transform: rotate(-3deg);
}


/* CONFÉRENCES */

.conferences {
    right: 4%;
    top: 150px;

    border-radius:
        55% 45% 48% 52% /
        44% 56% 54% 46%;

    transform: rotate(3deg);
}


/* SPÉCIALITÉS */

.specialites {
    right: 8%;
    top: 360px;

    border-radius:
        48% 52% 55% 45% /
        57% 43% 49% 51%;

    transform: rotate(-3deg);
}


/* REJOINDRE */

.rejoindre {
    left: 5%;
    top: 500px;

    border-radius:
        56% 44% 47% 53% /
        48% 52% 57% 43%;

    transform: rotate(3deg);
}


/* CONTACT */

.contact {
    right: 8%;
    top: 695px;

    border-radius:
        45% 55% 53% 47% /
        56% 44% 54% 46%;

    transform: rotate(-3deg);
}


/* hover */

.bulle:hover {
    transform:
        scale(1.05)
        rotate(0deg);

    box-shadow:
        0 20px 35px rgba(0,0,0,.15);
}


.bulle:active {
    transform: scale(.97);
}


/* =========================================================
   PETITES FORMES AUTOUR DES BULLES
========================================================= */

.small-shape {
    position: absolute;

    width: 42px;
    height: 42px;

    border: 2px solid var(--noir);

    border-radius:
        48% 52% 43% 57%;
}


/* près de fiches */

.shape-one {
    top: 90px;
    left: 34%;

    transform: rotate(25deg);
}


/* près des spécialités */

.shape-two {
    top: 430px;
    left: 32%;

    border-color: var(--rouge);

    transform: rotate(-20deg);
}


/* près du contact */

.shape-three {
    bottom: 50px;
    left: 42%;

    border-color: var(--jaune);

    transform: rotate(15deg);
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    position: relative;

    text-align: center;

    padding: 25px 20px 50px;

    border-top: 1px solid #111;

    background: var(--blanc);

    font-size: 14px;

    font-weight: 600;

    letter-spacing: 1px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    header {
        height: 90px;
    }

    .logo {
        width: 90px;
    }

    header::after {
        width: 90px;
        height: 90px;
    }


    main {
        width: 100%;
    }


    .intro {
        padding:
            55px 18px 30px;
    }


    .intro h1 {
        font-size: 56px;

        letter-spacing: -2px;
    }


    .intro p {
        font-size: 18px;
    }


    .intro::before {
        left: 5%;

        width: 45px;
        height: 45px;
    }

    }

    }

        right: -5%;

    }


    .points-top-right {
        right: -10px;
        top: 150px;

        transform: scale(.8);
    }


    .points-middle-left {
        left: -20px;
        top: 390px;

        transform: scale(.75);
    }


    .points-bottom-right {
        right: -15px;
        bottom: 130px;

        transform: scale(.75);
    }


    .yellow-corner {
        width: 100px;
        height: 100px;

        left: -50px;
    }


    .red-corner {
        width: 105px;
        height: 105px;

        right: -50px;
    }


    .yellow-bottom {
        width: 110px;
        height: 110px;

        left: -55px;
    }


    .black-curve {
        width: 110px;
        height: 50px;
    }


    .curve-one {
        left: 27%;
        top: 105px;
    }


    .curve-two {
        right: 26%;
        top: 275px;
    }


    .curve-three {
        left: 26%;
        top: 455px;
    }


    .small-shape {
        width: 30px;
        height: 30px;
    }

}


@media (max-width: 430px) {

    .bulle {
        width: 185px;
        height: 132px;

        font-size: 21px;
    }

    .intro h1 {
        font-size: 51px;
    }

}

</style>
</head>
