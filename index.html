        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {
            --bleu: #77A5AA;
            --bleu-clair: #EAF3F4;
            --fond: #FAFCFC;
            --noir: #111111;
            --blanc: #FFFFFF;
        }


        /* =====================================================
           BASE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--fond);
            color: var(--noir);
            font-family: "League Spartan", sans-serif;
            overflow-x: hidden;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           DÉCOR GLOBAL
        ===================================================== */

        .decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }


        /* =====================================================
           FORMES ORGANIQUES
        ===================================================== */

        .forme {
            position: absolute;
            background: var(--bleu-clair);
            z-index: 0;
        }


        .forme-haut-gauche {
            width: 310px;
            height: 180px;
            left: -115px;
            top: 105px;

            border-radius:
                62% 38% 53% 47% /
                48% 58% 42% 52%;

            transform: rotate(-18deg);
        }


        .forme-haut-droite {
            width: 270px;
            height: 220px;
            right: -105px;
            top: 45px;

            border-radius:
                40% 60% 55% 45% /
                58% 42% 58% 42%;

            transform: rotate(22deg);
        }


        .forme-bas-gauche {
            width: 350px;
            height: 240px;
            left: -175px;
            bottom: 80px;

            border-radius:
                55% 45% 38% 62% /
                45% 55% 45% 55%;

            transform: rotate(15deg);
        }


        .forme-bas-droite {
            width: 300px;
            height: 210px;
            right: -140px;
            bottom: 15px;

            border-radius:
                48% 52% 63% 37% /
                55% 45% 55% 45%;

            transform: rotate(-15deg);
        }


        /* =====================================================
           VAGUES DANS LES COINS
        ===================================================== */

        .vague {
            position: absolute;
            width: 240px;
            height: 115px;
            border: 3px solid var(--bleu);
            border-left-color: transparent;
            border-bottom-color: transparent;
            border-radius: 55% 45% 50% 50%;
        }


        .vague.fine {
            border-width: 1.5px;
        }


        .vague-haut-gauche {
            left: -105px;
            top: 150px;
            transform: rotate(-28deg);
        }


        .vague-haut-gauche-2 {
            left: -80px;
            top: 180px;
            transform: rotate(-28deg);
        }


        .vague-haut-droite {
            right: -95px;
            top: 135px;
            transform: rotate(150deg);
        }


        .vague-bas-gauche {
            left: -115px;
            bottom: 150px;
            transform: rotate(12deg);
        }


        .vague-bas-droite {
            right: -100px;
            bottom: 115px;
            transform: rotate(170deg);
        }


        /* =====================================================
           COURBES NOIRES
        ===================================================== */

        .courbe {
            position: absolute;
            border: 3px solid var(--noir);
            border-left-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            opacity: 0.9;
        }


        .courbe.one {
            width: 230px;
            height: 125px;
            left: -70px;
            top: 315px;
            transform: rotate(28deg);
        }


        .courbe.two {
            width: 180px;
            height: 95px;
            right: -65px;
            top: 420px;
            transform: rotate(-25deg);
        }


        .courbe.three {

            height: 120px;
            right: -120px;
            bottom: 285px;
            transform: rotate(155deg);

           AMAS DE POINTS
        ===================================================== */

            position: absolute;
            width: 75px;
            height: 65px;
        }


        .points span {

            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--bleu);
        }

            top: 8px;

            top: 3px;

            top: 11px;
        }

        .points span:nth-child(4) {
            left: 56px;
            top: 5px;
        }

        .points span:nth-child(5) {
            left: 13px;
            top: 25px;
        }

        .points span:nth-child(6) {
            left: 31px;
            top: 31px;

        .points span:nth-child(7) {
            left: 49px;
            top: 27px;
        }

        .points span:nth-child(8) {
            left: 67px;
            top: 34px;

            left: 5px;
            top: 46px;
        }

        .points span:nth-child(10) {
            left: 23px;
            top: 52px;
        }

        .points span:nth-child(11) {
            left: 43px;
            top: 47px;
        }

        .points span:nth-child(12) {
            left: 60px;
            top: 55px;
        }

            width: 5px;
            height: 5px;

            top: 165px;

            top: 540px;
            transform: rotate(-12deg);
        }


        .points-bas {
            right: 12%;
            bottom: 105px;
            transform: rotate(8deg);
        }


        /* =====================================================
           CONTENU
        ===================================================== */

        .conteneur {
            position: relative;
            z-index: 2;
            width: min(1120px, calc(100% - 40px));
            margin: auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: relative;
            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;

            min-height: 125px;

            background: var(--bleu);

            padding: 20px 30px;

            overflow: hidden;

            border-radius:
                0 0 45% 55% /
                0 0 35% 45%;

            box-shadow:
                0 12px 30px rgba(119,165,170,0.16);
        }


        header::after {
            content: "";
            position: absolute;

            width: 220px;
            height: 90px;

            right: -60px;
            bottom: -45px;

            background: rgba(255,255,255,0.12);

            border-radius: 50%;
        }


        header img {
            width: 125px;
            height: auto;

            filter:
                brightness(0)
                invert(1);

            position: relative;
            z-index: 2;
        }


        header span {
            color: var(--blanc);

            font-size: 16px;
            font-weight: 700;

            letter-spacing: 2.5px;
            text-transform: uppercase;

            position: relative;
            z-index: 2;
        }


        /* =====================================================
           INTRODUCTION
        ===================================================== */

        .intro {
            text-align: center;
            padding: 75px 15px 50px;
        }


        .intro h1 {
            margin: 0;

            color: var(--bleu);

            font-size: clamp(65px, 10vw, 105px);

            line-height: 0.9;

            font-weight: 800;

            letter-spacing: -4px;
        }


        .intro p {
            max-width: 650px;

            margin: 30px auto 0;

            font-size: 20px;

            line-height: 1.45;

            font-weight: 400;

            color: var(--noir);
        }


        .intro strong {
            color: var(--bleu);
            font-weight: 700;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navigation {
            position: relative;

            min-height: 820px;

            margin-top: 10px;
        }


        /* =====================================================
           COURBE CENTRALE
        ===================================================== */

        .ligne-centrale {
            position: absolute;

            width: 720px;
            height: 370px;

            left: 50%;
            top: 170px;

            transform:
                translateX(-50%)
                rotate(-8deg);

            border: 2px solid var(--noir);

            border-left-color: transparent;
            border-bottom-color: transparent;

            border-radius: 50%;

            opacity: 0.85;

            pointer-events: none;
        }


        /* =====================================================
           BULLES
        ===================================================== */

        .bulle {
            position: absolute;

            width: 290px;
            min-height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            color: var(--blanc);

            background: var(--bleu);

            text-decoration: none;

            text-align: center;

            font-size: 31px;
            line-height: 1.05;

            font-weight: 700;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            box-shadow:
                0 15px 28px rgba(0,0,0,0.10);
        }

        .fiches {
            left: 4%;
            top: 20px;

            border-radius:
                42% 58% 52% 48% /
                58% 44% 56% 42%;

            transform: rotate(-4deg);
        }


        .conferences {
            right: 4%;
            top: 135px;

            border-radius:
                58% 42% 46% 54% /
                43% 57% 47% 53%;

            transform: rotate(4deg);
        }


        .specialites {
            right: 8%;
            top: 350px;

            border-radius:
                48% 52% 60% 40% /
                55% 45% 53% 47%;

            transform: rotate(-3deg);
        }


        .rejoindre {
            left: 5%;
            top: 465px;

            border-radius:

                48% 52% 58% 42%;

            transform: rotate(3deg);
        }


        .contact {
            right: 8%;
            top: 625px;

            border-radius:
                44% 56% 53% 47% /
                54% 46% 57% 43%;

            transform: rotate(-4deg);
        }


        .bulle:hover {
            transform:
                scale(1.06)
                rotate(0deg);

            box-shadow:
                0 22px 40px rgba(0,0,0,0.16);
        }

           FOOTER
        ===================================================== */

        footer {
            position: relative;
            z-index: 2;

            text-align: center;

            padding: 25px 20px 55px;

            color: var(--bleu);

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 1.5px;
        }


        /* =====================================================

        @media (max-width: 430px) {
